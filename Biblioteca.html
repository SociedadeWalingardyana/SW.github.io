<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca - SW Editorial</title>
<style>
/* ... Mantive todo o seu CSS original intacto ... */
body { margin: 0; font-family: sans-serif; background: #000; color: #e7e9ee; }
.topbar { padding: 1rem; background: #1a0901; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 10; }
.layout { display: flex; min-height: calc(100vh - 58px); }
.sidebar { background: #000; padding: 1rem; overflow: auto; border-right: 1px solid #1a0901; width: 260px; }
.main { display: flex; flex: 1; gap: 1.5rem; padding: 1rem; }
#grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; flex: 1; overflow-y: auto; max-height: calc(100vh - 2rem); }
#novelGrid { width: 280px; background: #1a0901; display: flex; flex-direction: column; gap: 1rem; overflow-y: auto; padding: 1rem; border-left: 2px solid #1a0901; }
#novelGrid h2 { font-size: 1.2rem; font-weight: bold; text-align: center; color: #ffffff; margin-bottom: 1rem; flex-shrink: 0; }
.card-book { background: #1a0901; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #333; }
.cover { width: 100%; aspect-ratio: 3/4; background: #000; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.meta { padding: 1rem 1rem 0.5rem 1rem; }
.meta h3 { margin: 0 0 0.4rem 0; font-size: 1.2rem; }
.meta .author { color: #aab0bd; font-size: 0.9rem; font-style: italic; margin-bottom: 0.6rem; }
.meta .synopsis { font-size: 0.85rem; color: #c0c0c0; line-height: 1.4; white-space: pre-line; }
.actions { display: flex; gap: .5rem; padding: 0.8rem 1rem 1rem 1rem; align-items: center; }
.btn { padding: .5rem .8rem; border-radius: 12px; border: none; cursor: pointer; background: #000; color: #e7e9ee; display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.9rem; width: 64px; height: 36px; }
.fav[aria-pressed="true"]::before { content: "★"; color: #fff; }
.fav[aria-pressed="false"]::before { content: "☆"; }
.star-count { color: #fff; font-weight: 400; font-size: 0.7rem; }
.comment-section { margin-top: 2rem; background: #1a0901; padding: 1rem; border-radius: 12px; }
.comment-section textarea { width: 100%; height: 80px; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 0.5rem; box-sizing: border-box; }
.btn-comment { margin-top: 0.5rem; width: 100%; background: #000; color: #fff; padding: 0.6rem; border: none; border-radius: 8px; cursor: pointer; }
.drawer { position: fixed; inset:0; background: rgba(0,0,0,.95); display:flex; flex-direction:column; transform:translateY(100%); transition: transform .2s ease; z-index:50; }
.drawer.open { transform: translateY(0); }
.drawer-content { overflow-y:auto; padding:1rem; display:flex; flex-direction:column; align-items:center; }
.drawer-content img { width:100%; max-width: 800px; height:auto; margin-bottom:1rem; }
#drawer .topbar { display: flex; align-items: center; justify-content: center; position: relative; padding: 1rem; background: #1a0901; }
#drawer .topbar #closeDrawer { position: absolute; left: 1rem; }
#drawer .topbar #toggleSlide { position: absolute; right: 1rem; }
</style>
</head>
<body>

<header class="topbar">Biblioteca</header>

<div class="layout">
    <aside class="sidebar">
        <h2>Suas obras reunidas em um só lugar.</h2>
        <div class="comment-section">
            <h3>Deixe seu comentário</h3>
            <textarea placeholder="O que você está lendo hoje?"></textarea>
            <button class="btn-comment">Enviar</button>
        </div>
    </aside>

    <main class="main">
        <div id="grade"></div>
        <div id="novelGrid">
            <h2>NOVELS SW</h2>
        </div>
    </main>
</div>

<div id="drawer" class="drawer" aria-hidden="true">
    <div class="topbar">
        <button class="btn" id="closeDrawer">Fechar</button>
        <h2 id="drawerTitle"></h2>
        <button class="btn" id="toggleSlide">Slide</button>
    </div>
    <div class="drawer-content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBPSH4g1rtk27n9wCCBJZ2GK1UKCMH-Yjs",
  authDomain: "login-sw-14940.firebaseapp.com",
  // O segredo está aqui: use o mesmo banco do login!
  databaseURL: "https://login-sw-14940-default-rtdb.europe-west1.firebasedatabase.app/", 
  projectId: "login-sw-14940",
  appId: "1:252978150700:web:2c7d3997389f7675058089"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

const livros = [
  {id:1, titulo:"Melissa", autor:"Wellington Novaes", capa:"Mellissa.png", pasta:"paginas_compendio", totalPaginas:6, prefixo: "Pagina ", sinopse:"Uma jornada emocionante de descoberta e coragem."},
  {id:2, titulo:"Triohnte", autor:"Gabryell Aweryan", capa:"capaT.png", pasta:"Triohnte", totalPaginas:3, prefixo: "", sinopse:"Um épico de fantasia sombria e intrigas políticas."},
  {id:3, titulo:"Virtudes", autor:"Francisco de Assis", capa:"Virtudes.png", pasta:"Virtudes", totalPaginas:3, prefixo: "Pagina ", sinopse:"Reflexões sobre a bondade e a espiritualidade."}
];

const novels = [
  {id:101, titulo:"Segredários", autor:"Gabryell Aweryan", capa:"SEG.png", pasta:"S CAPS", totalPaginas:1, prefixo: "S CAP ", sinopse:"Marco, João e Lucas vivem a rotina bizarra da Kenya Enlatados..."}
];

const grade = document.getElementById("grade");
const novelGrid = document.getElementById("novelGrid");

function renderCard(item, container, includeFav=false){
  const card = document.createElement("div");
  card.className = "card-book";
  card.innerHTML = `
    <div class="cover"><img src="${item.capa}"></div>
    <div class="meta">
      <h3>${item.titulo}</h3>
      <div class="author">Por: ${item.autor}</div>
      <div class="synopsis">${item.sinopse}</div>
    </div>
    <div class="actions">
      <button class="btn ler" data-id="${item.id}">Ler</button>
      ${includeFav ? `<button class="btn fav" aria-pressed="false" data-id="${item.id}">
        <span class="star-count" id="stars-${item.id}">0</span>
      </button>` : ""}
    </div>`;
  container.appendChild(card);
}

livros.forEach(l => renderCard(l, grade, true));
novels.forEach(n => renderCard(n, novelGrid, true));

// Monitorar estrelas
[...livros, ...novels].forEach(item => {
  db.ref("estrelas/"+item.id).on("value", snap => {
    const el = document.getElementById("stars-"+item.id);
    if(el) el.textContent = snap.val() || 0;
  });
});

// EVENTO DE CLIQUE COM TRAVA DE SEGURANÇA
document.body.addEventListener("click", e => {
  const btnLer = e.target.closest(".ler");
  if(btnLer){
    const id = btnLer.dataset.id;
    const item = [...livros, ...novels].find(x => x.id == id);
    const user = auth.currentUser;

    if (!user) {
        alert("🔒 Acesso restrito. Faça login para ler suas obras.");
        return;
    }

    // Verifica se o ID do livro está marcado como 'true' para este usuário
    db.ref(`usuarios/${user.uid}/livros_comprados/${id}`).once('value', snap => {
        if (snap.exists() && snap.val() === true) {
            if(item) openDrawer(item);
        } else {
            alert("❌ Você ainda não possui esta obra em sua coleção. Visite nossa loja!");
        }
    });
    return;
  }

  const btnFav = e.target.closest(".fav");
  if(btnFav){
    const id = btnFav.dataset.id;
    btnFav.setAttribute("aria-pressed","true");
    db.ref("estrelas/"+id).transaction(v => (v||0)+1);
  }
});

function openDrawer(item){
  const drawer = document.getElementById("drawer");
  const content = document.querySelector(".drawer-content");
  document.getElementById("drawerTitle").textContent = item.titulo;
  content.innerHTML = "";
  for(let i=1; i<=item.totalPaginas; i++){
    const img = document.createElement("img");
    img.src = `${item.pasta}/${item.prefixo}${i}.png`;
    content.appendChild(img);
  }
  drawer.classList.add("open");
  document.body.style.overflow = "hidden";
}

document.getElementById("closeDrawer").onclick = () => {
  document.getElementById("drawer").classList.remove("open");
  document.body.style.overflow = "auto";
};

// Comentários (com proteção de login)
btnComment.onclick = () => {
    const user = auth.currentUser;
    if(!user) return alert("Faça login para comentar.");
    if(!textarea.value.trim()) return;

    db.ref(`usuarios/${user.uid}`).once('value', snap => {
        const d = snap.val() || {};
        db.ref("comentarios").push({
            texto: textarea.value,
            data: Date.now(),
            pais: `- de ${d.nome || user.email.split('@')[0]} (${d.pais || 'Walingardyn'})`
        });
        textarea.value = "";
    });
};
</script>
</body>
</html>
