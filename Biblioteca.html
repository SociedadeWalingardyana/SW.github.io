<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca</title>
<style>
body { margin: 0; font-family: sans-serif; background: #0f0f10; color: #e7e9ee; }
.topbar { padding: 1rem; background: #15161a; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 10; }
.layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 58px); }
.sidebar { background: #17181a; padding: 1rem; overflow: auto; border-right: 1px solid #2b2d32; }
.main { padding: 1rem; }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }

.comment-section { margin-top: 2rem; background: #ffffff; padding: 1rem; border-radius: 12px; color: #1a1a1a; }
.comment-section h3 { margin-top: 0; font-size: 1.1rem; color: #0f0f10; }
.comment-section textarea {
    width: 100%;
    height: 80px;
    margin: 0;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 0.5rem;
    resize: vertical;
    box-sizing: border-box;
}
.btn-comment {
    margin-top: 0.5rem;
    width: 100%;
    background: #15161a;
    color: white;
    padding: 0.5rem;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    box-sizing: border-box;
}
.comment-section p { margin: 0.25rem 0; }

.card-book { background: #17181a; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #2b2d32; }
.cover { width: 100%; aspect-ratio: 3/4; background: #101114; }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.meta { padding: .75rem; }
.meta .author { color: #aab0bd; font-size: .9rem; }
.actions { display: flex; gap: .5rem; padding: .5rem .75rem; align-items: center; }
.btn { padding: .4rem .75rem; border-radius: 12px; border: none; cursor: pointer; background: #2b2d32; color: #e7e9ee; }
.fav[aria-pressed="true"]::after { content: "★"; }
.fav[aria-pressed="false"]::after { content: "☆"; }
.star-count { color: #ffd700; }

.drawer { position: fixed; inset:0; background: rgba(0,0,0,.95); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1rem; transform:translateY(100%); transition: transform .2s ease; z-index:50; }
.drawer.open { transform: translateY(0); }
.drawer-content { display:flex; flex-direction:column; align-items:center; width:100%; height:100%; overflow-y:auto; padding:1rem; box-sizing:border-box; }
.drawer-content img { width:100%; height:auto; margin-bottom:1rem; border:1px solid #2b2d32; border-radius:8px; }
.drawer-controls { display:flex; gap:.5rem; align-items:center; justify-content:center; padding:1rem 0; }
.reading-mode .topbar, .reading-mode .drawer-controls { opacity:0; pointer-events:none; }
.reading-mode .drawer-content { padding:0; background:#000; }
.reading-mode .drawer-content img { border:none; border-radius:0; margin-bottom:0; }
</style>
</head>
<body>

<header class="topbar">Biblioteca</header>

<div class="layout">
<aside class="sidebar">
<h2>Suas obras reunidas em um só lugar.</h2>
<div class="comment-section">
<h3>Deixe seu comentário</h3>
<textarea placeholder="O que você está lendo hoje?"></textarea>
<button class="btn-comment">Enviar</button>
</div>
</aside>

<main class="main">
<div id="grade" class="grid"></div>
</main>
</div>

<div id="drawer" class="drawer" aria-hidden="true">
  <div class="topbar">
    <button class="btn" id="closeDrawer">Fechar</button>
    <h2 id="drawerTitle"></h2>
    <button class="btn" id="toggleReadingMode">Ver em Slide</button>
  </div>
  <div class="drawer-content"></div>
  <div class="drawer-controls">
    <button class="btn" id="zoomOut">-</button>
    <button class="btn" id="zoomIn">+</button>
    <span id="pageInfo">0 de 0</span>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// 🔥 CONFIGURE AQUI
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "sw-biblio.firebaseapp.com",
  databaseURL: "https://sw-biblio-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sw-biblio",
  appId: "SEU_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// 📚 LIVROS
const livros = [
  {id:1, titulo:"Melissa", autor:"Wellington Novaes", capa:"Mellissa.png", pasta:"páginas compendio", totalPaginas:6},
  {id:2, titulo:"Triohnte", autor:"Gabryell Aweryan", capa:"capaT.png", pasta:"Triohnte", totalPaginas:3},
  {id:3, titulo:"Virtudes", autor:"Francisco de Assis", capa:"Virtudes.png", pasta:"Virtudes", totalPaginas:3}
];

// 🎨 RENDER
const grade = document.getElementById("grade");
const section = document.querySelector(".comment-section");
const textarea = section.querySelector("textarea");
const btnComment = section.querySelector(".btn-comment");

let userCountry = "Desconhecido";
fetch("https://ipapi.co/json/").then(r=>r.json()).then(d=>userCountry=d.country_name||"Desconhecido");

function addComment(text, country){
    const p=document.createElement("p");
    p.textContent=`• ${text} - ${country}`;
    section.appendChild(p);
}

livros.forEach(l => {
  const card = document.createElement("div");
  card.className = "card-book";
  card.innerHTML = `
    <div class="cover"><img src="${l.capa}"></div>
    <div class="meta"><h3>${l.titulo}</h3><div class="author">${l.autor}</div></div>
    <div class="actions">
      <button class="btn ler" data-id="${l.id}">Ler</button>
      <button class="btn fav" aria-pressed="false" data-id="${l.id}"></button>
      <span class="star-count" id="stars-${l.id}">0</span>
    </div>
  `;
  grade.appendChild(card);

  db.ref("estrelas/"+l.id).on("value", snap=>{
    document.getElementById("stars-"+l.id).textContent = snap.val()||0;
  });
});

// ⭐ ESTRELAS
grade.addEventListener("click", e=>{
  const btn = e.target.closest(".fav");
  if(btn){
    const id = btn.dataset.id;
    btn.setAttribute("aria-pressed","true");
    db.ref("estrelas/"+id).transaction(v=>(v||0)+1);
    return;
  }
  const btnLer = e.target.closest(".ler");
  if(btnLer){
    const livro = livros.find(l=>l.id==btnLer.dataset.id);
    if(!livro) return;
    openDrawer(livro);
  }
});

// 💬 COMENTÁRIOS
db.ref("comentarios").limitToLast(20).once("value", snap=>{
    snap.forEach(c=>addComment(c.val().texto, c.val().pais||"Desconhecido"));
});
db.ref("comentarios").limitToLast(1).on("child_added", snap=>{
    addComment(snap.val().texto, snap.val().pais||"Desconhecido");
});
btnComment.onclick=()=>{
    if(!textarea.value.trim()) return;
    db.ref("comentarios").push({texto:textarea.value, data:Date.now(), pais:userCountry});
    addComment(textarea.value, userCountry);
    textarea.value="";
};

// 📖 DRAWER IMERSIVO
const drawer=document.getElementById("drawer");
const drawerContent=document.querySelector(".drawer-content");
const drawerTitle=document.getElementById("drawerTitle");
const closeDrawer=document.getElementById("closeDrawer");
const toggleReadingMode=document.getElementById("toggleReadingMode");
const zoomIn=document.getElementById("zoomIn");
const zoomOut=document.getElementById("zoomOut");
const pageInfo=document.getElementById("pageInfo");

let currentTotalPages=0;
let intersectionObserver=null;
let imageZoom=1;

function openDrawer(livro){
  drawerTitle.textContent=livro.titulo;
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden","false");
  drawerContent.innerHTML="";
  currentTotalPages=livro.totalPaginas;
  pageInfo.textContent=`1 de ${currentTotalPages}`;
  const pages=[];
  for(let i=1;i<=livro.totalPaginas;i++){
    const img=document.createElement("img");
    img.src=`${livro.pasta}/Pagina ${i}.png`;
    img.dataset.page=i;
    drawerContent.appendChild(img);
    pages.push(img);
  }
  if(intersectionObserver) intersectionObserver.disconnect();
  intersectionObserver=new IntersectionObserver(entries=>{
    let maxRatio=0,currentPage=1;
    entries.forEach(entry=>{
      if(entry.intersectionRatio>maxRatio){
        maxRatio=entry.intersectionRatio;
        currentPage=Number(entry.target.dataset.page);
      }
    });
    pageInfo.textContent=`${currentPage} de ${currentTotalPages}`;
  },{threshold:0.5});
  pages.forEach(p=>intersectionObserver.observe(p));
}

closeDrawer.onclick=()=>{
  drawer.classList.remove("open");
  drawer.setAttribute("aria-hidden","true");
  document.body.classList.remove("reading-mode");
}

toggleReadingMode.onclick=()=>{
  document.body.classList.toggle("reading-mode");
  toggleReadingMode.textContent=document.body.classList.contains("reading-mode")?"Sair do Slide":"Ver em Slide";
}

zoomIn.onclick=()=>{
  imageZoom=Math.min(2,imageZoom+0.1);
  drawerContent.style.transform=`scale(${imageZoom})`;
}
zoomOut.onclick=()=>{
  imageZoom=Math.max(0.5,imageZoom-0.1);
  drawerContent.style.transform=`scale(${imageZoom})`;
}
</script>

</body>
</html>
