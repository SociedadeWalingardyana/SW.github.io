<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca</title>
<style>
body { 
    margin: 0; 
    font-family: sans-serif; 
    background: #000; 
    color: #e7e9ee; 
}

.topbar { 
    padding: 1rem; 
    background: #1a0901; 
    display: flex; 
    align-items: center; 
    gap: 1rem; 
    position: sticky; 
    top: 0; 
    z-index: 10; 
}

.layout { 
    display: flex; 
    min-height: calc(100vh - 58px); 
}

/* Sidebar */
.sidebar { 
    background: #000;
    padding: 1rem; 
    overflow: auto; 
    border-right: 1px solid #1a0901; 
    width: 260px;
}

/* Main area: livros + novels */
.main { 
    display: flex;
    flex: 1;
    gap: 1.5rem;
    padding: 1rem; 
}

/* Grid de livros */
#grade {
    display: grid; 
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
    gap: 1.5rem; 
    flex: 1; 
    overflow-y: auto;
    max-height: calc(100vh - 2rem);
}

/* Coluna de Novels */
#novelGrid {
    width: 280px;
    background: #1a0901;
    display: flex;
    flex-direction: column;
    gap: 1rem;
    overflow-y: auto;
    padding: 1rem;
    border-left: 2px solid #1a0901;
}

/* Título da coluna de novels */
#novelGrid h2 {
    font-size: 1.2rem;
    font-weight: bold;
    text-align: center;
    color: #ffffff;
    margin-bottom: 1rem;
    flex-shrink: 0;
}

/* Cards */
.card-book { 
    background: #1a0901; 
    border-radius: 20px; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
    border: 1px solid #333; 
}

.cover { 
    width: 100%; 
    aspect-ratio: 3/4; 
    background: #000; 
}

.cover img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
}

.meta { 
    padding: 1rem 1rem 0.5rem 1rem; 
}

.meta h3 {
    margin: 0 0 0.4rem 0;
    font-size: 1.2rem;
}

.meta .author { 
    color: #aab0bd; 
    font-size: 0.9rem;
    font-style: italic;
    margin-bottom: 0.6rem;
}

.meta .synopsis {
    font-size: 0.85rem;
    color: #c0c0c0;
    line-height: 1.4;
    white-space: pre-line; /* permite quebrar linhas da sinopse */
}

.actions { 
    display: flex; 
    gap: .5rem; 
    padding: 0.8rem 1rem 1rem 1rem; 
    align-items: center; 
}

.btn { 
    padding: .5rem .8rem; 
    border-radius: 12px; 
    border: none; 
    cursor: pointer; 
    background: #000; 
    color: #e7e9ee; 
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    width: 64px;
    height: 36px;
}

.fav::before { 
    font-size: 16px; 
    line-height: 1;
    flex-shrink: 0;
}

.fav[aria-pressed="true"]::before { 
    content: "★"; 
    color: #fff; 
}

.fav[aria-pressed="false"]::before { 
    content: "☆"; 
}

.star-count { 
    color: #fff;
    font-weight: 400;
    font-size: 0.7rem;
}

/* Comentários */
.comment-section { 
    margin-top: 2rem; 
    background: #1a0901; 
    padding: 1rem; 
    border-radius: 12px; 
}
.comment-section textarea { 
    width: 100%; 
    height: 80px; 
    background: #000; 
    color: #fff; 
    border: 1px solid #333; 
    border-radius: 8px; 
    padding: 0.5rem; 
    box-sizing: border-box; 
}
.btn-comment { 
    margin-top: 0.5rem; 
    width: 100%; 
    background: #000; 
    color: #fff; 
    padding: 0.6rem; 
    border: none; 
    border-radius: 8px; 
    cursor: pointer; 
}

/* Drawer */
.drawer { 
    position: fixed; 
    inset:0; 
    background: rgba(0,0,0,.95); 
    display:flex; 
    flex-direction:column; 
    transform:translateY(100%); 
    transition: transform .2s ease; 
    z-index:50; 
}
.drawer.open { transform: translateY(0); }
.drawer-content { overflow-y:auto; padding:1rem; display:flex; flex-direction:column; align-items:center; }
.drawer-content img { width:100%; max-width: 800px; height:auto; margin-bottom:1rem; }

#drawer .topbar {
    display: flex;
    align-items: center;
    justify-content: center; 
    position: relative;
    padding: 1rem;
    background: #1a0901;
}

#drawer .topbar #closeDrawer { position: absolute; left: 1rem; }
#drawer .topbar #toggleSlide { position: absolute; right: 1rem; }
</style>
</head>
<body>

<header class="topbar">Biblioteca</header>

<div class="layout">
    <aside class="sidebar">
        <h2>Suas obras reunidas em um só lugar.</h2>
        <div class="comment-section">
            <h3>Deixe seu comentário</h3>
            <textarea placeholder="O que você está lendo hoje?"></textarea>
            <button class="btn-comment">Enviar</button>
        </div>
    </aside>

    <main class="main">
        <!-- Coluna esquerda: Livros -->
        <div id="grade"></div>
        <!-- Coluna direita: Novels -->
        <div id="novelGrid">
            <h2>NOVELS SW</h2>
        </div>
    </main>
</div>

<div id="drawer" class="drawer" aria-hidden="true">
    <div class="topbar">
        <button class="btn" id="closeDrawer">Fechar</button>
        <h2 id="drawerTitle"></h2>
        <button class="btn" id="toggleSlide">Slide</button>
    </div>
    <div class="drawer-content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
// FIREBASE
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "sw-biblio.firebaseapp.com",
  databaseURL: "https://sw-biblio-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sw-biblio",
  appId: "SEU_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// LIVROS
const livros = [
  {id:1, titulo:"Melissa", autor:"Wellington Novaes", capa:"Mellissa.png", pasta:"páginas compendio", totalPaginas:6, sinopse:"Uma jornada emocionante de descoberta e coragem."},
  {id:2, titulo:"Triohnte", autor:"Gabryell Aweryan", capa:"capaT.png", pasta:"Triohnte", totalPaginas:3, sinopse:"Um épico de fantasia sombria e intrigas políticas."},
  {id:3, titulo:"Virtudes", autor:"Francisco de Assis", capa:"Virtudes.png", pasta:"Virtudes", totalPaginas:3, sinopse:"Reflexões sobre a bondade e a espiritualidade."}
];

// NOVELS
const novels = [
  {
    id:101, 
    titulo:"Segredários", 
    autor:"Gabryell Aweryan", 
    capa:"SEG.png", 
    pasta:"Novels/Seg", 
    totalPaginas:4, 
    sinopse:`Marco, João e Lucas vivem a rotina sem graça da Kenya Enlatados, uma pequena empresa de São Paulo que enlata legumes e sardinhas. Mas a monotonia acaba quando recebem um telefonema inesperado de Cleber F. Junior, do Amazonas: investigar um parque aquático abandonado, palco de uma tragédia que ainda assombra o local.

Aproveitando que suas férias estavam chegando, inventam um retiro espiritual para justificar a ausência, e claro, o chefe não entende nada! Munidos de curiosidade, improviso e sua van carateristicamente cômica, os Segredários partem rumo ao Amazonas.

No parque, descobrem que Cleber desapareceu misteriosamente e que a missão agora é coordenada por seu filho, Victor, que quer resolver o problema da propriedade para vendê-la. Entre mistérios, absurdos e perigos que ninguém ousaria enfrentar, Marco, João e Lucas vão aprender que segredos enterrados nem sempre ficam onde deveriam, e que a linha entre o banal e o bizarro pode ser mais fina do que imaginam.`
  },
  {id:102, titulo:"Fora do ar", autor:"----", capa:"novel2.png", pasta:"Novels/Cinzas", totalPaginas:3, sinopse:"----"}
];

const grade = document.getElementById("grade");
const novelGrid = document.getElementById("novelGrid");

// Função genérica render card
function renderCard(item, container, includeFav=false){
  const card = document.createElement("div");
  card.className = "card-book";
  card.innerHTML = `
    <div class="cover"><img src="${item.capa}"></div>
    <div class="meta">
      <h3>${item.titulo}</h3>
      <div class="author">Por: ${item.autor}</div>
      <div class="synopsis">${item.sinopse}</div>
    </div>
    <div class="actions">
      <button class="btn ler" data-id="${item.id}">Ler</button>
      ${includeFav ? `<button class="btn fav" aria-pressed="false" data-id="${item.id}">
        <span class="star-count" id="stars-${item.id}">0</span>
      </button>` : ""}
    </div>`;
  container.appendChild(card);
}

// Render de livros e novels com votação
livros.forEach(l => renderCard(l, grade, true));
novels.forEach(n => renderCard(n, novelGrid, true));

// Firebase estrelas
[...livros, ...novels].forEach(item => {
  db.ref("estrelas/"+item.id).on("value", snap => {
    const el = document.getElementById("stars-"+item.id);
    if(el) el.textContent = snap.val() || 0;
  });
});

// Clique global
document.body.addEventListener("click", e => {
  const btnFav = e.target.closest(".fav");
  if(btnFav){
    const id = btnFav.dataset.id;
    btnFav.setAttribute("aria-pressed","true");
    db.ref("estrelas/"+id).transaction(v => (v||0)+1);
    return;
  }

  const btnLer = e.target.closest(".ler");
  if(btnLer){
    const id = btnLer.dataset.id;
    const item = [...livros, ...novels].find(x => x.id == id);
    if(item) openDrawer(item);
  }
});

// Função drawer
function openDrawer(item){
  const drawer = document.getElementById("drawer");
  const content = document.querySelector(".drawer-content");
  document.getElementById("drawerTitle").textContent = item.titulo;
  content.innerHTML = "";
  for(let i=1;i<=item.totalPaginas;i++){
    const img = document.createElement("img");
    img.src = `${item.pasta}/Pagina ${i}.png`;
    content.appendChild(img);
  }
  drawer.classList.add("open");
  document.body.style.overflow = "hidden";
}

document.getElementById("closeDrawer").onclick = () => {
  document.getElementById("drawer").classList.remove("open");
  document.body.style.overflow = "auto";
};

// Comentários
const btnComment = document.querySelector(".btn-comment");
const textarea = document.querySelector(".comment-section textarea");
const section = document.querySelector(".comment-section");

db.ref("comentarios").limitToLast(20).once("value", snap=>{
    snap.forEach(c=>addComment(c.val().texto, c.val().pais||"Desconhecido"));
});
db.ref("comentarios").limitToLast(1).on("child_added", snap=>{
    addComment(snap.val().texto, snap.val().pais||"Desconhecido");
});

btnComment.onclick = () => {
    if(!textarea.value.trim()) return;
    db.ref("comentarios").push({
        texto: textarea.value,
        data: Date.now(),
        pais: "- de Desconhecido"
    });
    textarea.value = "";
};

function addComment(text, country){
    const p = document.createElement("p");
    p.innerHTML = `${text} <span class="comment-country">${country}</span>`;
    section.appendChild(p);
}
</script>
</body>
</html>
