<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca</title>

<style>

/* =========================================================
   PALETA
   CABEÇALHO: BRANCO
   RESTANTE: PRETO
========================================================= */

body {
    margin: 0;
    font-family: sans-serif;
    background: #000;
    color: #fff;
}

/* =========================================================
   CABEÇALHO
========================================================= */

.topbar {
    padding: 1rem;
    background: #fff;
    color: #000;
    display: flex;
    align-items: center;
    gap: 1rem;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid #000;
    box-sizing: border-box;
}

.topbar h1,
.topbar h2,
.topbar span,
.topbar div {
    color: #000;
}

/* =========================================================
   ESTRUTURA
========================================================= */

.layout {
    display: flex;
    min-height: calc(100vh - 58px);
}

.sidebar {
    background: #000;
    padding: 1rem;
    overflow: auto;
    border-right: 1px solid #fff;
    width: 260px;
    flex-shrink: 0;
    box-sizing: border-box;
}

.sidebar h2,
.sidebar h3 {
    color: #fff;
}

.main {
    display: flex;
    flex: 1;
    gap: 1.5rem;
    padding: 1rem;
    align-items: flex-start;
    background: #000;
    box-sizing: border-box;
}

/* =========================================================
   GRADE DE LIVROS
========================================================= */

#grade {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.5rem;
    flex: 1;
}

/* =========================================================
   NOVELS
========================================================= */

#novelGrid {
    width: 300px;
    background: #000;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    padding: 1rem;
    border-left: 1px solid #fff;
    flex-shrink: 0;
    box-sizing: border-box;
}

#novelGrid h2 {
    font-size: 1.2rem;
    font-weight: bold;
    text-align: center;
    color: #fff;
    margin: 0 0 0.5rem 0;
}

/* =========================================================
   CARDS
========================================================= */

.card-book {
    background: #000;
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    border: 1px solid #fff;
    height: auto;
    box-sizing: border-box;
}

.cover {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #000;
    flex-shrink: 0;
}

.cover img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.meta {
    padding: 1.2rem;
    flex-grow: 1;
}

.meta h3 {
    margin: 0 0 0.5rem 0;
    font-size: 1.2rem;
    color: #fff;
}

.meta .author {
    color: #fff;
    font-size: 0.9rem;
    font-style: italic;
    margin-bottom: 0.8rem;
}

.meta .synopsis {
    font-size: 0.85rem;
    color: #fff;
    line-height: 1.5;
    white-space: pre-line;
}

/* =========================================================
   AÇÕES
========================================================= */

.actions {
    display: flex;
    gap: 0.8rem;
    padding: 1.2rem;
    align-items: center;
    border-top: 1px solid #fff;
    margin-top: auto;
}

.btn {
    padding: .5rem .8rem;
    border-radius: 12px;
    border: 1px solid #fff;
    cursor: pointer;
    background: #000;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    width: 70px;
    height: 38px;
    flex-shrink: 0;
    box-sizing: border-box;
}

.btn:hover {
    background: #fff;
    color: #000;
}

.btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    filter: none;
}

.btn:disabled:hover {
    background: #000;
    color: #fff;
}

.fav[aria-pressed="true"]::before {
    content: "★";
    color: #fff;
}

.fav[aria-pressed="false"]::before {
    content: "☆";
    color: #fff;
}

.star-count {
    color: #fff;
    font-weight: 400;
    font-size: 0.75rem;
}

/* =========================================================
   COMENTÁRIOS
========================================================= */

.comment-section {
    margin-top: 2rem;
    background: #000;
    padding: 1rem;
    border: 1px solid #fff;
    border-radius: 12px;
    box-sizing: border-box;
}

.comment-section textarea {
    width: 100%;
    height: 80px;
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    border-radius: 8px;
    padding: 0.5rem;
    box-sizing: border-box;
    resize: none;
}

.comment-section textarea::placeholder {
    color: #fff;
    opacity: 0.65;
}

.btn-comment {
    margin-top: 0.5rem;
    width: 100%;
    background: #000;
    color: #fff;
    padding: 0.6rem;
    border: 1px solid #fff;
    border-radius: 8px;
    cursor: pointer;
}

.btn-comment:hover {
    background: #fff;
    color: #000;
}

#listaComentarios {
    margin-top: 1.5rem;
}

.comentario-item {
    border-bottom: 1px solid #fff;
    padding: 12px 0;
}

.comentario-texto {
    font-size: 0.9rem;
    color: #fff;
    margin: 0;
}

.comentario-meta {
    color: #fff;
    font-size: 0.75rem;
    display: block;
    margin-top: 6px;
}

/* =========================================================
   DRAWER
========================================================= */

.drawer {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform .2s ease;
    z-index: 50;
}

.drawer.open {
    transform: translateY(0);
}

.drawer-content {
    overflow-y: auto;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #000;
}

.drawer-content img {
    width: 100%;
    max-width: 800px;
    height: auto;
    margin-bottom: 1rem;
}

/* Cabeçalho do Drawer também branco */

#drawer .topbar {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 1rem;
    background: #fff;
    color: #000;
    border-bottom: 1px solid #000;
}

#drawer .topbar h2 {
    color: #000;
    margin: 0;
}

#drawer .topbar #closeDrawer {
    position: absolute;
    left: 1rem;
}

#drawer .topbar #toggleSlide {
    position: absolute;
    right: 1rem;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #000;
}

::-webkit-scrollbar-thumb {
    background: #fff;
}

::-webkit-scrollbar-thumb:hover {
    background: #fff;
}

/* =========================================================
   RESPONSIVIDADE
========================================================= */

@media (max-width: 900px) {

    .layout {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        border-right: none;
        border-bottom: 1px solid #fff;
    }

    .main {
        flex-direction: column;
    }

    #grade {
        width: 100%;
    }

    #novelGrid {
        width: 100%;
        border-left: none;
        border-top: 1px solid #fff;
    }
}

</style>
</head>
