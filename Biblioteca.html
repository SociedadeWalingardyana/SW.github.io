<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biblioteca</title>

    <style>
        body { margin: 0; font-family: sans-serif; background: #0f0f10; color: #e7e9ee; }
        .topbar { padding: 1rem; background: #15161a; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 10; }
        .layout { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 58px); }
        .sidebar { background: #17181a; padding: 1rem; overflow: auto; border-right: 1px solid #2b2d32; }
        .main { padding: 1rem; }
        .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
        
        /* Estilos da Caixa de Comentários */
        .comment-section { margin-top: 2rem; background: #ffffff; padding: 1rem; border-radius: 12px; color: #1a1a1a; }
        .comment-section h3 { margin-top: 0; font-size: 1.1rem; color: #0f0f10; }
        .comment-section textarea { 
            width: 100%; 
            height: 80px; 
            margin-top: 0.5rem; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            padding: 0.5rem; 
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        .btn-comment { 
            margin-top: 0.5rem; 
            width: 100%; 
            background: #15161a; 
            color: white; 
            padding: 0.5rem; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
        }
        .btn-comment:hover { background: #333; }

        /* Estilos originais mantidos */
        .card-book { background: #17181a; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform .1s; border: 1px solid #2b2d32; }
        .card-book:hover { transform: translateY(-2px); }
        .cover { width: 100%; aspect-ratio: 3/4; background: #101114; display: flex; align-items: center; justify-content: center; }
        .cover img { width: 100%; height: 100%; object-fit: cover; }
        .meta { padding: .75rem; }
        .meta h3 { margin: 0 0 .25rem 0; }
        .meta .author { color: #aab0bd; font-size: .9rem; }
        .actions { display: flex; gap: .5rem; padding: .5rem .75rem; align-items: center; }
        .btn { padding: .4rem .75rem; border-radius: 12px; border: none; cursor: pointer; background: #2b2d32; color: #e7e9ee; }
        .btn:hover { background: #3a3d45; }
        .fav[aria-pressed="true"]::after { content: "★"; margin-left: .25rem; }
        .fav[aria-pressed="false"]::after { content: "☆"; margin-left: .25rem; }
        .star-count { font-size: .9rem; color: #ffd700; margin-left: .25rem; }
        .drawer { position: fixed; inset: 0; background: rgba(0, 0, 0, .95); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1rem; transform: translateY(100%); transition: transform .2s ease; z-index: 50; }
        .drawer.open { transform: translateY(0); }
        .drawer-content { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; overflow-y: auto; padding: 1rem; box-sizing: border-box; }
        .drawer-content img { width: 100%; height: auto; margin-bottom: 1rem; border: 1px solid #2b2d32; border-radius: 8px; }
        .drawer-controls { display: flex; gap: .5rem; align-items: center; justify-content: center; padding: 1rem 0; }
        .reading-mode .topbar, .reading-mode .drawer-controls { opacity: 0; pointer-events: none; }
        .reading-mode .drawer-content { padding: 0; background: #000; }
        .reading-mode .drawer-content img { border: none; border-radius: 0; margin-bottom: 0; }
    </style>
</head>
<body>

<header class="topbar">
    <div class="title">Biblioteca</div>
</header>

<div class="layout">
    <aside class="sidebar">
        <h2>Suas obras reunidas em um só lugar.</h2>
        
        <div class="comment-section">
            <h3>Deixe seu comentário</h3>
            <textarea placeholder="O que você está lendo hoje?"></textarea>
            <button class="btn-comment">Enviar</button>
        </div>
    </aside>

    <main class="main">
        <div id="grade" class="grid"></div>
    </main>
</div>

<div id="drawer" class="drawer" aria-hidden="true">
    <div class="topbar">
        <button class="btn" id="closeDrawer">Fechar</button>
        <h2 id="drawerTitle"></h2>
        <button class="btn" id="toggleReadingMode">Ver em Slide</button>
    </div>
    <div class="drawer-content"></div>
    <div class="drawer-controls">
        <button class="btn" id="zoomOut">-</button>
        <button class="btn" id="zoomIn">+</button>
        <span id="pageInfo">0 de 0</span>
    </div>
</div>

<script>
const state = {
    livros: [
        {id: 1, titulo: "Melissa", autor: "Wellington Novaes", capa: "Mellissa.png", baixado: true, favorito: true, tipo: "imagens", pasta: "páginas compendio", totalPaginas: 6, estrelas: 0},
        {id: 2, titulo: "Triohnte", autor: "Gabryell Aweryan", capa: "capaT.png", baixado: true, favorito: false, tipo: "imagens", pasta: "Triohnte", totalPaginas: 3, estrelas: 0},
         {id: 3, titulo: "Virtudes", autor: "Francisco de Assis", capa: "Virtudes.png", baixado: true, favorito: false, tipo: "imagens", pasta: "Triohnte", totalPaginas: 3, estrelas: 0}
    ]
};

function render() {
    const grade = document.getElementById("grade");
    grade.innerHTML = "";
    state.livros.forEach(l => {
        const card = document.createElement("div");
        card.className = "card-book";
        card.innerHTML = `
            <div class="cover"><img src="${l.capa}" alt="Capa"/></div>
            <div class="meta"><h3>${l.titulo}</h3><div class="author">${l.autor}</div></div>
            <div class="actions">
                <button class="btn" data-action="baixar" data-id="${l.id}">Ler</button>
                <button class="btn fav" aria-pressed="${l.favorito}" data-action="favoritar" data-id="${l.id}"></button>
                <span class="star-count" id="stars-${l.id}">${l.estrelas}</span>
            </div>
        `;
        grade.appendChild(card);
    });
}

const drawer = document.getElementById("drawer");
const drawerContent = document.querySelector(".drawer-content");
const zoomInBtn = document.getElementById("zoomIn");
const zoomOutBtn = document.getElementById("zoomOut");
const pageInfoSpan = document.getElementById("pageInfo");

let currentTotalPages = 0;
let intersectionObserver = null;

function openDrawer(title, pasta, totalPaginas) {
    document.getElementById("drawerTitle").textContent = title;
    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
    drawerContent.innerHTML = '';
    currentTotalPages = totalPaginas;
    pageInfoSpan.textContent = `1 de ${currentTotalPages}`;
    const pages = [];
    for (let i = 1; i <= totalPaginas; i++) {
        const img = document.createElement("img");
        img.src = `${pasta}/Pagina ${i}.png`;
        img.alt = `Página ${i}`;
        img.className = 'pdf-page-image';
        img.dataset.page = i;
        drawerContent.appendChild(img);
        pages.push(img);
    }
    if (intersectionObserver) intersectionObserver.disconnect();
    intersectionObserver = new IntersectionObserver((entries) => {
        let currentPage = 1;
        let maxRatio = 0;
        entries.forEach(entry => {
            if (entry.intersectionRatio > maxRatio) {
                maxRatio = entry.intersectionRatio;
                currentPage = Number(entry.target.dataset.page);
            }
        });
        pageInfoSpan.textContent = `${currentPage} de ${currentTotalPages}`;
    }, { threshold: 0.5 });
    pages.forEach(page => intersectionObserver.observe(page));
}

function closeDrawer() {
    drawer.classList.remove("open");
    drawer.setAttribute("aria-hidden", "true");
    document.body.classList.remove("reading-mode");
}

document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
document.getElementById("toggleReadingMode").addEventListener("click", () => {
    document.body.classList.toggle("reading-mode");
    const toggleButton = document.getElementById("toggleReadingMode");
    toggleButton.textContent = document.body.classList.contains("reading-mode") ? "Sair do Slide" : "Ver em Slide";
});

let imageZoom = 1;
zoomInBtn.addEventListener("click", () => {
    imageZoom = Math.min(2.0, imageZoom + 0.1);
    drawerContent.style.transform = `scale(${imageZoom})`;
});
zoomOutBtn.addEventListener("click", () => {
    imageZoom = Math.max(0.5, imageZoom - 0.1);
    drawerContent.style.transform = `scale(${imageZoom})`;
});

document.getElementById("grade").addEventListener("click", e => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = Number(btn.dataset.id);
    const livro = state.livros.find(l => l.id === id);
    if (btn.dataset.action === "baixar" && livro) {
        openDrawer(livro.titulo, livro.pasta, livro.totalPaginas);
    }
    if (btn.dataset.action === "favoritar" && livro) {
        livro.favorito = !livro.favorito;
        btn.setAttribute("aria-pressed", livro.favorito);
        livro.estrelas = livro.favorito ? livro.estrelas + 1 : Math.max(0, livro.estrelas - 1);
        document.getElementById(`stars-${livro.id}`).textContent = livro.estrelas;
    }
});

render();
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Biblioteca Global</title>

    <style>
        body { margin: 0; font-family: sans-serif; background: #0f0f10; color: #e7e9ee; }
        .topbar { padding: 1rem; background: #15161a; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #2b2d32; }
        .layout { display: grid; grid-template-columns: 300px 1fr; min-height: calc(100vh - 58px); }
        .sidebar { background: #17181a; padding: 1rem; overflow: auto; border-right: 1px solid #2b2d32; }
        .main { padding: 1rem; }
        .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
        
        /* Comentários */
        .comment-section { margin-top: 2rem; background: #1c1d21; padding: 1rem; border-radius: 12px; border: 1px solid #2b2d32; }
        .comment-section h3 { margin-top: 0; font-size: 1rem; color: #fff; }
        .comment-section textarea { 
            width: 100%; height: 80px; margin-top: 0.5rem; background: #0f0f10;
            border: 1px solid #3a3d45; border-radius: 8px; padding: 0.5rem; 
            color: white; box-sizing: border-box; resize: none;
        }
        .btn-comment { 
            margin-top: 0.5rem; width: 100%; background: #3498db; 
            color: white; padding: 0.6rem; border: none; border-radius: 8px; cursor: pointer; 
        }
        .btn-comment:hover { background: #2980b9; }

        #comments-display { margin-top: 1rem; max-height: 300px; overflow-y: auto; font-size: 0.85rem; }
        .comment-item { padding: 0.5rem; border-bottom: 1px solid #2b2d32; color: #aab0bd; }

        /* Estilos dos Cards */
        .card-book { background: #17181a; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #2b2d32; transition: transform .2s; }
        .card-book:hover { transform: translateY(-5px); }
        .cover { width: 100%; aspect-ratio: 3/4; background: #101114; display: flex; align-items: center; justify-content: center; }
        .cover img { width: 100%; height: 100%; object-fit: cover; }
        .meta { padding: .75rem; }
        .meta h3 { margin: 0 0 .25rem 0; font-size: 1rem; }
        .meta .author { color: #aab0bd; font-size: .85rem; }
        .actions { display: flex; gap: .5rem; padding: .5rem .75rem; align-items: center; }
        .btn { padding: .4rem .75rem; border-radius: 10px; border: none; cursor: pointer; background: #2b2d32; color: #e7e9ee; }
        .fav[aria-pressed="true"]::after { content: " ★"; color: #ffd700; }
        .fav[aria-pressed="false"]::after { content: " ☆"; }
        .star-count { font-size: .9rem; color: #ffd700; font-weight: bold; }

        /* Drawer de Leitura */
        .drawer { position: fixed; inset: 0; background: rgba(0, 0, 0, .98); display: none; flex-direction: column; z-index: 100; }
        .drawer.open { display: flex; }
        .drawer-content { flex: 1; overflow-y: auto; padding: 2rem; display: flex; flex-direction: column; align-items: center; }
        .drawer-content img { max-width: 800px; width: 100%; margin-bottom: 1rem; border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<header class="topbar">
    <div class="title"><strong>BIBLIOTECA MUNDIAL</strong></div>
</header>

<div class="layout">
    <aside class="sidebar">
        <h3>Comentários da Galáxia</h3>
        <div class="comment-section">
            <textarea id="msgInput" placeholder="O que você está lendo hoje?"></textarea>
            <button class="btn-comment" id="sendBtn">Enviar Comentário</button>
        </div>
        <div id="comments-display">
            </div>
    </aside>

    <main class="main">
        <div id="grade" class="grid"></div>
    </main>
</div>

<div id="drawer" class="drawer">
    <div class="topbar">
        <button class="btn" onclick="closeDrawer()">Voltar</button>
        <h2 id="drawerTitle" style="font-size: 1rem;"></h2>
    </div>
    <div class="drawer-content" id="drawerContent"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 1. SUBSTITUA PELAS SUAS CHAVES DO FIREBASE AQUI
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "seu-projeto.firebaseapp.com",
        databaseURL: "https://seu-projeto-default-rtdb.firebaseio.com",
        projectId: "seu-projeto",
        storageBucket: "seu-projeto.appspot.com",
        appId: "1:..."
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Estado Local das Obras
    const livrosBase = [
        {id: 1, titulo: "Melissa", autor: "Wellington Novaes", capa: "Mellissa.png", pasta: "páginas compendio", paginas: 6},
        {id: 2, titulo: "Triohnte", autor: "Gabryell Aweryan", capa: "capaT.png", pasta: "Triohnte", paginas: 3},
        {id: 3, titulo: "Virtudes", autor: "Francisco de Assis", capa: "Virtudes.png", pasta: "Triohnte", paginas: 3}
    ];

    // --- RENDERIZAÇÃO E ESTRELAS ---
    function initApp() {
        const grade = document.getElementById("grade");
        livrosBase.forEach(l => {
            const card = document.createElement("div");
            card.className = "card-book";
            card.innerHTML = `
                <div class="cover"><img src="${l.capa}"></div>
                <div class="meta"><h3>${l.titulo}</h3><div class="author">${l.autor}</div></div>
                <div class="actions">
                    <button class="btn" onclick="window.openReader('${l.titulo}', '${l.pasta}', ${l.paginas})">Ler</button>
                    <button class="btn fav" id="fav-${l.id}" onclick="window.toggleStar(${l.id})"></button>
                    <span class="star-count" id="count-${l.id}">0</span>
                </div>
            `;
            grade.appendChild(card);

            // Escutar Estrelas do Banco (Mundial)
            onValue(ref(db, `estrelas/livro_${l.id}`), (snapshot) => {
                const qtd = snapshot.val() || 0;
                document.getElementById(`count-${l.id}`).textContent = qtd;
            });
        });
    }

    // Função Global de Votação
    window.toggleStar = (id) => {
        const btn = document.getElementById(`fav-${id}`);
        const isPressed = btn.getAttribute("aria-pressed") === "true";
        const newStatus = !isPressed;
        
        btn.setAttribute("aria-pressed", newStatus);
        
        const estrelaRef = ref(db, `estrelas/livro_${id}`);
        onValue(estrelaRef, (snapshot) => {
            const atual = snapshot.val() || 0;
            const novoValor = newStatus ? atual + 1 : Math.max(0, atual - 1);
            set(estrelaRef, novoValor);
        }, { onlyOnce: true });
    };

    // --- COMENTÁRIOS ---
    const sendBtn = document.getElementById("sendBtn");
    const msgInput = document.getElementById("msgInput");
    const display = document.getElementById("comments-display");

    sendBtn.onclick = () => {
        if(!msgInput.value.trim()) return;
        push(ref(db, 'comentarios'), {
            texto: msgInput.value,
            timestamp: Date.now()
        });
        msgInput.value = "";
    };

    // Escutar Comentários do Banco (Mundial)
    onValue(ref(db, 'comentarios'), (snapshot) => {
        display.innerHTML = "";
        const data = snapshot.val();
        if(data) {
            Object.values(data).reverse().forEach(c => {
                const div = document.createElement("div");
                div.className = "comment-item";
                div.textContent = `> ${c.texto}`;
                display.appendChild(div);
            });
        }
    });

    // --- LEITOR ---
    window.openReader = (title, pasta, total) => {
        document.getElementById("drawerTitle").textContent = title;
        const container = document.getElementById("drawerContent");
        container.innerHTML = "";
        for(let i=1; i<=total; i++) {
            const img = document.createElement("img");
            img.src = `${pasta}/Pagina ${i}.png`;
            container.appendChild(img);
        }
        document.getElementById("drawer").classList.add("open");
    };

    window.closeDrawer = () => {
        document.getElementById("drawer").classList.remove("open");
    };

    initApp();
</script>

</body>
</html>
