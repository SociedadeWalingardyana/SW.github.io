<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --black: #000;
    --white: #fff;
    --line: #222;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: var(--black);
    color: var(--white);
    font-family: Georgia, "Times New Roman", serif;
}

/* =========================================================
   CABEÇALHO
========================================================= */

header {
    background: #fff;
    color: #000;
    min-height: 82px;
    padding: 0 5vw;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid #000;
}

.logo {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.45rem;
    font-weight: bold;
    letter-spacing: .08em;
    text-transform: uppercase;
}

.header-title {
    font-family: Arial, sans-serif;
    font-size: .72rem;
    letter-spacing: .25em;
    text-transform: uppercase;
}

/* =========================================================
   INTRODUÇÃO
========================================================= */

.hero {
    padding: 70px 5vw 55px;
    border-bottom: 1px solid var(--line);
}

.hero-label {
    font-family: Arial, sans-serif;
    font-size: .7rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    margin-bottom: 20px;
}

.hero h1 {
    font-size: clamp(3rem, 8vw, 7rem);
    line-height: .85;
    font-weight: normal;
    margin: 0;
    max-width: 900px;
}

.hero p {
    max-width: 650px;
    margin: 30px 0 0;
    color: #aaa;
    font-family: Arial, sans-serif;
    font-size: .95rem;
    line-height: 1.7;
}

/* =========================================================
   CONTEÚDO
========================================================= */

.content {
    width: 90%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 55px 0 100px;
}

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid #fff;
    padding-bottom: 15px;
    margin-bottom: 35px;
}

.section-heading h2 {
    margin: 0;
    font-size: 1.8rem;
    font-weight: normal;
}

.section-heading span {
    font-family: Arial, sans-serif;
    font-size: .7rem;
    letter-spacing: .2em;
    text-transform: uppercase;
}

/* =========================================================
   LAYOUT PRINCIPAL
========================================================= */

.library-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    gap: 55px;
    align-items: start;
}

/* =========================================================
   LIVROS
========================================================= */

#grade {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 45px 30px;
}

/* =========================================================
   CARD
========================================================= */

.card-book {
    background: #000;
    border: none;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.cover {
    width: 100%;
    aspect-ratio: 3 / 4;
    background: #080808;
    overflow: hidden;
    position: relative;
    border: 1px solid #222;
}

.cover img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform .5s ease;
}

.card-book:hover .cover img {
    transform: scale(1.025);
}

.meta {
    padding: 22px 2px 10px;
}

.meta h3 {
    font-size: 1.55rem;
    font-weight: normal;
    margin: 0 0 8px;
}

.author {
    font-family: Arial, sans-serif;
    font-size: .7rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 18px;
}

.synopsis {
    font-family: Arial, sans-serif;
    font-size: .83rem;
    line-height: 1.65;
    color: #aaa;
    white-space: pre-line;
}

/* =========================================================
   AÇÕES
========================================================= */

.actions {
    display: flex;
    gap: 8px;
    padding-top: 15px;
    border-top: 1px solid #222;
}

.btn {
    height: 42px;
    padding: 0 18px;
    border: 1px solid #fff;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    font-size: .7rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: .2s ease;
}

.btn:hover:not(:disabled) {
    background: #fff;
    color: #000;
}

.btn:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.fav {
    width: 52px;
    padding: 0;
    font-size: 1rem;
}

.fav[aria-pressed="true"]::before {
    content: "★";
}

.fav[aria-pressed="false"]::before {
    content: "☆";
}

.star-count {
    font-family: Arial, sans-serif;
    font-size: .65rem;
    margin-left: 4px;
}

/* =========================================================
   COLUNA DIREITA — NOVELS
========================================================= */

#novelGrid {
    width: auto;
    background: #000;
    border-left: 1px solid #fff;
    padding-left: 30px;
}

#novelGrid > h2 {
    margin: 0 0 28px;
    font-size: 1.7rem;
    font-weight: normal;
}

#novelGrid .card-book {
    margin-bottom: 45px;
}

#novelGrid .meta h3 {
    font-size: 1.35rem;
}

#novelGrid .cover {
    aspect-ratio: 3 / 4;
}

/* =========================================================
   COMENTÁRIOS
========================================================= */

.comments {
    margin-top: 90px;
    padding-top: 35px;
    border-top: 1px solid #fff;
}

.comments-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 30px;
}

.comments-header h2 {
    margin: 0;
    font-size: 1.8rem;
    font-weight: normal;
}

.comments-header span {
    font-family: Arial, sans-serif;
    font-size: .65rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: #888;
}

.comment-form {
    display: grid;
    grid-template-columns: 1fr 130px;
    gap: 10px;
    margin-bottom: 40px;
}

.comment-form textarea {
    height: 90px;
    resize: none;
    background: #000;
    color: #fff;
    border: 1px solid #333;
    padding: 15px;
    font-family: Arial, sans-serif;
    font-size: .85rem;
    outline: none;
}

.comment-form textarea:focus {
    border-color: #fff;
}

.comment-form textarea::placeholder {
    color: #555;
}

.btn-comment {
    background: #fff;
    color: #000;
    border: 1px solid #fff;
    cursor: pointer;
    font-family: Arial, sans-serif;
    font-size: .7rem;
    letter-spacing: .15em;
    text-transform: uppercase;
}

.btn-comment:hover {
    background: #000;
    color: #fff;
}

#listaComentarios {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
}

.comentario-item {
    border-top: 1px solid #333;
    padding-top: 15px;
}

.comentario-texto {
    font-family: Georgia, serif;
    font-size: 1rem;
    line-height: 1.5;
    margin: 0;
}

.comentario-meta {
    display: block;
    color: #666;
    font-family: Arial, sans-serif;
    font-size: .65rem;
    margin-top: 12px;
}

/* =========================================================
   LEITOR
========================================================= */

.drawer {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    transform: translateY(100%);
    transition: transform .35s ease;
    z-index: 500;
}

.drawer.open {
    transform: translateY(0);
}

.drawer-header {
    min-height: 75px;
    background: #fff;
    color: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 15px 80px;
}

.drawer-header h2 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: normal;
}

.drawer-header .btn {
    position: absolute;
    border-color: #000;
    background: #fff;
    color: #000;
}

#closeDrawer {
    left: 20px;
}

#toggleSlide {
    right: 20px;
}

.drawer-content {
    overflow-y: auto;
    padding: 35px 20px 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.drawer-content img {
    width: 100%;
    max-width: 850px;
    height: auto;
    display: block;
    margin-bottom: 20px;
}

/* =========================================================
   RESPONSIVO
========================================================= */

@media (max-width: 1050px) {

    .library-layout {
        grid-template-columns: 1fr;
    }

    #novelGrid {
        border-left: none;
        border-top: 1px solid #fff;
        padding: 40px 0 0;
    }

    #novelGrid .card-book {
        max-width: 400px;
    }
}

@media (max-width: 650px) {

    header {
        min-height: 65px;
        padding: 0 20px;
    }

    .header-title {
        display: none;
    }

    .hero {
        padding: 50px 20px 45px;
    }

    .content {
        width: calc(100% - 40px);
        padding-top: 40px;
    }

    #grade {
        grid-template-columns: 1fr;
    }

    .comment-form {
        grid-template-columns: 1fr;
    }

    .btn-comment {
        height: 45px;
    }

    .drawer-header {
        padding-left: 75px;
        padding-right: 75px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     CABEÇALHO
===================================================== -->

<header>

    <div class="logo">
        Biblioteca
    </div>

</header>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

    <div class="hero-label">
        Acervo literário
    </div>

    <h1>
        Gravura
    </h1>

    <p>
        Um lugar para reunir histórias, mundos e autores.
        Explore as obras disponíveis no acervo da Editora Gravura.
    </p>

</section>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="content">

    <div class="section-heading">

        <h2>Obras</h2>

        <span>
            Catálogo
        </span>

    </div>


    <div class="library-layout">

        <!-- LIVROS PRINCIPAIS -->

        <section>

            <div id="grade"></div>

        </section>


        <!-- NOVELS -->

        <aside id="novelGrid">

            <h2>
                Nossos Novels
            </h2>

        </aside>

    </div>


    <!-- =================================================
         COMENTÁRIOS
    ================================================== -->

    <section class="comments">

        <div class="comments-header">

            <h2>
                Leituras
            </h2>

            <span>
                Comentários dos leitores
            </span>

        </div>

        <div class="comment-form">

            <textarea
                id="commentText"
                placeholder="Compartilhe suas impressões sobre uma obra..."
            ></textarea>

            <button
                class="btn-comment"
                id="btnComment"
            >
                Publicar
            </button>

        </div>

        <div id="listaComentarios"></div>

    </section>

</main>


<!-- =====================================================
     LEITOR
===================================================== -->

<div
    id="drawer"
    class="drawer"
    aria-hidden="true"
>

    <div class="drawer-header">

        <button
            class="btn"
            id="closeDrawer"
        >
            Fechar
        </button>

        <h2 id="drawerTitle"></h2>

        <button
            class="btn"
            id="toggleSlide"
        >
            Slide
        </button>

    </div>

    <div class="drawer-content"></div>

</div>


<!-- =====================================================
     FIREBASE
===================================================== -->

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


<script>

/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyBPSH4g1rtk27n9wCCBJ2ZGK1UKCMH-Yjs",

    authDomain:
        "login-sw-14940.firebaseapp.com",

    databaseURL:
        "https://login-sw-14940-default-rtdb.europe-west1.firebasedatabase.app/",

    projectId:
        "login-sw-14940",

    appId:
        "1:252978150700:web:2c7d3997389f7675058089"

};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();


/* =========================================================
   LIVROS
========================================================= */

const livros = [

    {
        id: 1,
        titulo: "Melissa",
        autor: "Wellington Novaes",
        capa: "link_da_capa.png",
        pasta: "paginas_compendio",
        totalPaginas: 6,
        prefixo: "Pagina ",
        synopsis:
            "Composto ao longo de treze anos, Melissa — Desespero, Amor e Morte, é uma antologia de contos de terror, realismo mágico, crônicas e confissões..."
    },

    {
        id: 2,
        titulo: "Triohnte",
        autor: "Gabryell Aweryan",
        capa: "Coloque aqui seu png",
        pasta: "Triohnte",
        totalPaginas: 3,
        prefixo: "",
        synopsis:
            "No tumultuoso mundo de Walingardyn, onde profecias antigas e guerras entre nobres definem o destino de gerações..."
    }

];


const novels = [

    {
        id: 101,
        titulo: "Segredários",
        autor: "Gabryell Aweryan",
        capa: "Coloque aqui seu png",
        pasta: "S CAPS",
        totalPaginas: 1,
        prefixo: "S CAP ",
        synopsis:
            "Marco, João e Lucas vivem a rotina sem graça da Kenya Enlatados, uma pequena empresa de São Paulo que enlata legumes e sardinhas. Mas a monotonia acaba quando recebem um telefonema inesperado de Cleber F. Junior, do Amazonas: investigar um parque aquático abandonado, palco de uma tragédia que ainda assombra o local.\n\nAproveitando que suas férias estavam chegando, inventam um retiro espiritual para justificar a ausência, e claro, o chefe não entende nada! Munidos de curiosidade, improviso e sua van carateristicamente cômica, os Segredários partem rumo ao Amazonas.\n\nNo parque, descobrem que Cleber desapareceu misteriosamente e que a missão agora é coordenada por seu filho, Victor, que quer resolver o problema da propriedade para vendê-la. Entre mistérios, absurdos e perigos que ninguém ousaria enfrentar, Marco, João e Lucas vão aprender que segredos enterrados nem sempre ficam onde deveriam, e que a linha entre o banal e o bizarro pode ser mais fina do que imaginam."
    }

];


const grade =
    document.getElementById("grade");

const novelGrid =
    document.getElementById("novelGrid");


/* =========================================================
   CARDS
========================================================= */

function renderCard(
    item,
    container,
    includeFav = false
) {

    const card =
        document.createElement("article");

    card.className =
        "card-book";

    card.innerHTML = `

        <div class="cover">

            <img
                src="${item.capa}"
                alt="Capa de ${item.titulo}"
            >

        </div>

        <div class="meta">

            <h3>
                ${item.titulo}
            </h3>

            <div class="author">
                Por: ${item.autor}
            </div>

            <div class="synopsis">
                ${item.synopsis}
            </div>

        </div>

        <div class="actions">

            <button
                class="btn ler"
                data-id="${item.id}"
                disabled
            >
                🔒
            </button>

            ${
                includeFav
                ?
                `
                <button
                    class="btn fav"
                    aria-pressed="false"
                    data-id="${item.id}"
                    title="Favoritar"
                >
                    <span
                        class="star-count"
                        id="stars-${item.id}"
                    >
                        0
                    </span>
                </button>
                `
                :
                ""
            }

        </div>

    `;

    container.appendChild(card);
}


livros.forEach(
    livro => renderCard(
        livro,
        grade,
        true
    )
);

novels.forEach(
    novel => renderCard(
        novel,
        novelGrid,
        true
    )
);


/* =========================================================
   PERMISSÕES
========================================================= */

function atualizarPermissoesBotao(
    emailLogado
) {

    const permissoes =
        JSON.parse(
            localStorage.getItem(
                "sw_permissoes"
            )
        ) || [];

    document
        .querySelectorAll(".btn.ler")
        .forEach(botao => {

            const idDoLivro =
                botao.getAttribute(
                    "data-id"
                );

            const temAcesso =
                permissoes.some(
                    permissao =>

                    permissao.email
                        .toLowerCase() ===
                    emailLogado
                        .toLowerCase()

                    &&

                    permissao.bookId
                        .toString() ===
                    idDoLivro
                        .toString()
                );

            if (temAcesso) {

                botao.disabled = false;
                botao.innerText = "Ler";

            } else {

                botao.disabled = true;
                botao.innerText = "🔒";

            }

        });
}


auth.onAuthStateChanged(user => {

    if (
        user &&
        user.email
    ) {

        atualizarPermissoesBotao(
            user.email
        );

    }

});


/* =========================================================
   CLIQUES
========================================================= */

document.body.addEventListener(
    "click",
    event => {

        const btnLer =
            event.target.closest(
                ".ler"
            );

        if (
            btnLer &&
            !btnLer.disabled
        ) {

            const id =
                btnLer.dataset.id;

            const item =
                [...livros, ...novels]
                    .find(
                        livro =>
                            livro.id == id
                    );

            if (item) {
                openDrawer(item);
            }

            return;
        }


        const btnFav =
            event.target.closest(
                ".fav"
            );

        if (btnFav) {

            const id =
                btnFav.dataset.id;

            btnFav.setAttribute(
                "aria-pressed",
                "true"
            );

            db.ref(
                "estrelas/" + id
            ).transaction(
                valor =>
                    (valor || 0) + 1
            );

        }

    }
);


/* =========================================================
   LEITOR
========================================================= */

function openDrawer(item) {

    const drawer =
        document.getElementById(
            "drawer"
        );

    const content =
        document.querySelector(
            ".drawer-content"
        );

    document.getElementById(
        "drawerTitle"
    ).textContent =
        item.titulo;

    content.innerHTML = "";


    for (
        let i = 1;
        i <= item.totalPaginas;
        i++
    ) {

        const img =
            document.createElement(
                "img"
            );

        img.src =
            `${item.pasta}/${item.prefixo}${i}.png`;

        img.alt =
            `${item.titulo} — página ${i}`;

        content.appendChild(img);

    }


    drawer.classList.add(
        "open"
    );

    drawer.setAttribute(
        "aria-hidden",
        "false"
    );

    document.body.style.overflow =
        "hidden";
}


document.getElementById(
    "closeDrawer"
).onclick = () => {

    const drawer =
        document.getElementById(
            "drawer"
        );

    drawer.classList.remove(
        "open"
    );

    drawer.setAttribute(
        "aria-hidden",
        "true"
    );

    document.body.style.overflow =
        "auto";
};


/* =========================================================
   COMENTÁRIOS
========================================================= */

const btnComment =
    document.getElementById(
        "btnComment"
    );

const textarea =
    document.getElementById(
        "commentText"
    );


btnComment.onclick = () => {

    const user =
        auth.currentUser;

    if (!user) {

        alert(
            "Faça login para comentar."
        );

        return;
    }


    const texto =
        textarea.value.trim();

    if (!texto) {
        return;
    }


    db.ref(
        `usuarios/${user.uid}`
    ).once(
        "value",
        snapshot => {

            const dados =
                snapshot.val() || {};

            db.ref(
                "comentarios"
            ).push({

                texto: texto,

                data: Date.now(),

                pais:
                    `- de ${
                        dados.nome ||
                        user.email
                            .split("@")[0]
                    } (${
                        dados.pais ||
                        "Walingardyn"
                    })`

            });

            textarea.value = "";

        }
    );

};


db.ref(
    "comentarios"
).on(
    "child_added",
    snapshot => {

        const dados =
            snapshot.val();

        const lista =
            document.getElementById(
                "listaComentarios"
            );

        const div =
            document.createElement(
                "div"
            );

        div.className =
            "comentario-item";

        div.innerHTML = `

            <p class="comentario-texto">
                ${dados.texto}
            </p>

            <small class="comentario-meta">
                ${dados.pais}
                •
                ${new Date(
                    dados.data
                ).toLocaleDateString()}
            </small>

        `;

        lista.prepend(div);

    }
);


/* =========================================================
   ESTRELAS
========================================================= */

[...livros, ...novels]
    .forEach(item => {

        db.ref(
            "estrelas/" + item.id
        ).on(
            "value",
            snapshot => {

                const elemento =
                    document.getElementById(
                        "stars-" +
                        item.id
                    );

                if (elemento) {

                    elemento.textContent =
                        snapshot.val() || 0;

                }

            }
        );

    });

</script>

</body>
</html>
