<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca</title>
<style>
body { 
    margin: 0; 
    font-family: sans-serif; 
    background: #000000; 
    color: #e7e9ee; 
}

.topbar { 
    padding: 1rem; 
    background: #1a0901; 
    display: flex; 
    align-items: center; 
    gap: 1rem; 
    position: sticky; 
    top: 0; 
    z-index: 10; 
}

.layout { 
    display: grid; 
    grid-template-columns: 260px 1fr; 
    min-height: calc(100vh - 58px); 
}

.sidebar { 
    background: #000000;
    padding: 1rem; 
    overflow: auto; 
    border-right: 1px solid #1a0901; 
}

.main { 
    padding: 1rem; 
}

.grid { 
    display: grid; 
    gap: 1.5rem; 
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
}

.card-book { 
    background: #1a0901; 
    border-radius: 20px; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
    border: 1px solid #333; 
}

.cover { 
    width: 100%; 
    aspect-ratio: 3/4; 
    background: #000; 
}

.cover img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
}

.meta { 
    padding: 1rem 1rem 0.5rem 1rem; 
}

.meta h3 {
    margin: 0 0 0.4rem 0;
    font-size: 1.2rem;
}

.meta .author { 
    color: #aab0bd; 
    font-size: 0.9rem;
    font-style: italic;
    margin-bottom: 0.6rem;
}

.meta .synopsis {
    font-size: 0.85rem;
    color: #c0c0c0;
    line-height: 1.4;
}

.actions { 
    display: flex; 
    gap: .5rem; 
    padding: 0.8rem 1rem 1rem 1rem; 
    align-items: center; 
}





.btn { 
    padding: .5rem .8rem; 
    border-radius: 12px; 
    box-sizing: border-box;
    border: none; 
    cursor: pointer; 
    background: #000000; 
    color: #e7e9ee; 
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    font-size: 0.9rem;

    /* trava o tamanho */
    width: 64px;
    height: 36px;
}

/* estrela não influencia layout */
.fav::before { 
    font-size: 16px; 
    line-height: 1;
    flex-shrink: 0;
}

.fav[aria-pressed="true"]::before { 
    content: "★"; 
    color: #ffffff; 
}

.fav[aria-pressed="false"]::before { 
    content: "☆"; 
}

.star-count { 
    color: #ffffff;
    font-weight: 400;
    font-size: 0.7rem;
}









    





    

.comment-section { margin-top: 2rem; background: #1a0901; padding: 1rem; border-radius: 12px; }
.comment-section textarea { width: 100%; height: 80px; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 0.5rem; box-sizing: border-box; }
.btn-comment { margin-top: 0.5rem; width: 100%; background: #000; color: white; padding: 0.6rem; border: none; border-radius: 8px; cursor: pointer; }

.drawer { 
    position: fixed; 
    inset:0; 
    background: rgba(0,0,0,.95); 
    display:flex; 
    flex-direction:column; 
    transform:translateY(100%); 
    transition: transform .2s ease; 
    z-index:50; 
}
.drawer.open { transform: translateY(0); }
.drawer-content { overflow-y:auto; padding:1rem; display:flex; flex-direction:column; align-items:center; }
.drawer-content img { width:100%; max-width: 800px; height:auto; margin-bottom:1rem; }

/* --- Drawer topbar centralizado --- */
#drawer .topbar {
    display: flex;
    align-items: center;
    justify-content: center; /* centraliza o título */
    position: relative;
    padding: 1rem;
    background: #1a0901;
}

#drawer .topbar #closeDrawer {
    position: absolute;
    left: 1rem; /* botão à esquerda */
}

#drawer .topbar #toggleSlide {
    position: absolute;
    right: 1rem; /* botão slide à direita */
}
</style>
</head>
<body>

<header class="topbar">Biblioteca</header>

<div class="layout">
    <aside class="sidebar">
        <h2>Suas obras reunidas em um só lugar.</h2>
        <div class="comment-section">
            <h3>Deixe seu comentário</h3>
            <textarea placeholder="O que você está lendo hoje?"></textarea>
            <button class="btn-comment">Enviar</button>
        </div>
    </aside>
    <main class="main">
        <div id="grade" class="grid"></div>
    </main>
</div>

<div id="drawer" class="drawer" aria-hidden="true">
    <div class="topbar">
        <button class="btn" id="closeDrawer">Fechar</button>
        <h2 id="drawerTitle"></h2>
        <button class="btn" id="toggleSlide">Slide</button>
    </div>
    <div class="drawer-content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "sw-biblio.firebaseapp.com",
  databaseURL: "https://sw-biblio-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sw-biblio",
  appId: "SEU_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const livros = [
  {id:1, titulo:"Melissa", autor:"Wellington Novaes", capa:"Mellissa.png", pasta:"páginas compendio", totalPaginas:6, sinopse:"Uma jornada emocionante de descoberta e coragem."},
  {id:2, titulo:"Triohnte", autor:"Gabryell Aweryan", capa:"capaT.png", pasta:"Triohnte", totalPaginas:3, sinopse:"Um épico de fantasia sombria e intrigas políticas."},
  {id:3, titulo:"Virtudes", autor:"Francisco de Assis", capa:"Virtudes.png", pasta:"Virtudes", totalPaginas:3, sinopse:"Reflexões sobre a bondade e a espiritualidade."}
];

const grade = document.getElementById("grade");

// Renderiza os livros
livros.forEach(l => {
  const card = document.createElement("div");
  card.className = "card-book";
  card.innerHTML = `
    <div class="cover"><img src="${l.capa}"></div>
    <div class="meta">
      <h3>${l.titulo}</h3>
      <div class="author">Por: ${l.autor}</div>
      <div class="synopsis">${l.sinopse}</div>
    </div>
    <div class="actions">
      <button class="btn ler" data-id="${l.id}">Ler</button>
      <button class="btn fav" aria-pressed="false" data-id="${l.id}">
        <span class="star-count" id="stars-${l.id}">0</span>
      </button>
    </div>
  `;
  grade.appendChild(card);

  db.ref("estrelas/"+l.id).on("value", snap => {
    document.getElementById("stars-"+l.id).textContent = snap.val() || 0;
  });
});

grade.addEventListener("click", e => {
  const btnFav = e.target.closest(".fav");
  if(btnFav) {
    const id = btnFav.dataset.id;
    btnFav.setAttribute("aria-pressed", "true");
    db.ref("estrelas/"+id).transaction(v => (v || 0) + 1);
    return;
  }
  const btnLer = e.target.closest(".ler");
  if(btnLer) {
    const livro = livros.find(l => l.id == btnLer.dataset.id);
    if(livro) openDrawer(livro);
  }
});

// FUNÇÃO ABRIR DRAWER
function openDrawer(livro){
    const drawer = document.getElementById("drawer");
    const content = document.querySelector(".drawer-content");
    document.getElementById("drawerTitle").textContent = livro.titulo;
    content.innerHTML = "";
    for(let i=1; i<=livro.totalPaginas; i++) {
        const img = document.createElement("img");
        img.src = `${livro.pasta}/Pagina ${i}.png`;
        content.appendChild(img);
    }
    drawer.classList.add("open");
}

// FECHAR DRAWER
document.getElementById("closeDrawer").onclick = () => {
    document.getElementById("drawer").classList.remove("open");
};

// 💬 COMENTÁRIOS
const btnComment = document.querySelector(".btn-comment");
const textarea = document.querySelector(".comment-section textarea");
const section = document.querySelector(".comment-section");

db.ref("comentarios").limitToLast(20).once("value", snap=>{
    snap.forEach(c=>{
        addComment(c.val().texto, c.val().pais||"Desconhecido");
    });
});

db.ref("comentarios").limitToLast(1).on("child_added", snap=>{
    addComment(snap.val().texto, snap.val().pais||"Desconhecido");
});

btnComment.onclick = () => {
    if(!textarea.value.trim()) return;
    db.ref("comentarios").push({
        texto: textarea.value,
        data: Date.now(),
        pais: "- de Desconhecido"
    });
    textarea.value = "";
};

function addComment(text, country){
    const p = document.createElement("p");
    p.innerHTML = `${text} <span class="comment-country">${country}</span>`;
    section.appendChild(p);
}






<aside class="novels">
  <h2>Novels</h2>
  <p style="font-size:0.8rem;color:#aab0bd">Sessão de histórias rápidas</p>
  <div id="novelGrid" class="grid"></div>
</aside>

<style>
/* NOVELS CSS */
.novels {
  background: #000;
  padding: 1rem;
  overflow: auto;
  border-left: 1px solid #1a0901;
}
</style>

<script>
// NOVELS DATA
const novels = [
  {
    id: 101,
    titulo: "O Último Sino",
    autor: "Autor Desconhecido",
    capa: "novel1.png",
    pasta: "Novels/Sino",
    totalPaginas: 4,
    sinopse: "O sino toca apenas uma vez."
  },
  {
    id: 102,
    titulo: "Cinza no Cálice",
    autor: "Autor Desconhecido",
    capa: "novel2.png",
    pasta: "Novels/Cinzas",
    totalPaginas: 3,
    sinopse: "Uma fé escrita por outra mão."
  }
];

const novelGrid = document.getElementById("novelGrid");

// Função genérica para criar cards (livros ou novels)
function renderCard(item, container){
  const card = document.createElement("div");
  card.className = "card-book";
  card.innerHTML = `
    <div class="cover"><img src="${item.capa}"></div>
    <div class="meta">
      <h3>${item.titulo}</h3>
      <div class="author">Por: ${item.autor}</div>
      <div class="synopsis">${item.sinopse}</div>
    </div>
    <div class="actions">
      <button class="btn ler" data-id="${item.id}">Ler</button>
    </div>`;
  container.appendChild(card);
}

// Render livros existentes (garante que não some)
livros.forEach(l => renderCard(l, document.getElementById("grade")));

// Render Novels
novels.forEach(n => renderCard(n, novelGrid));

// Lógica única de abrir drawer
document.body.addEventListener("click", e => {
  const btn = e.target.closest(".ler");
  if (!btn) return;

  // busca entre livros + novels
  const item = [...livros, ...novels].find(x => x.id == btn.dataset.id);
  if (!item) return;

  const drawer = document.getElementById("drawer");
  const content = document.querySelector(".drawer-content");
  document.getElementById("drawerTitle").textContent = item.titulo;
  content.innerHTML = "";

  for(let i=1; i<=item.totalPaginas; i++){
    const img = document.createElement("img");
    img.src = `${item.pasta}/Pagina ${i}.png`;
    content.appendChild(img);
  }

  drawer.classList.add("open");
});










    
</script>
</body>
</html>
