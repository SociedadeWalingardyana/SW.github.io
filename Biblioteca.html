<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca</title>
<style>
body { 
    margin: 0; 
    font-family: sans-serif; 
    background: #000000; 
    color: #e7e9ee; 
}

.topbar { 
    padding: 1rem; 
    background: #1a0901; 
    display: flex; 
    align-items: center; 
    gap: 1rem; 
    position: sticky; 
    top: 0; 
    z-index: 10; 
}

.layout { 
    display: grid; 
    grid-template-columns: 260px 1fr; 
    min-height: calc(100vh - 58px); 
}

.sidebar { 
    background: #000000;
    padding: 1rem; 
    overflow: auto; 
    border-right: 1px solid #1a0901; 
}

.main { 
    padding: 1rem; 
}

.grid { 
    display: grid; 
    gap: 1.5rem; 
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); 
}

.card-book { 
    background: #1a0901; 
    border-radius: 20px; 
    overflow: hidden; 
    display: flex; 
    flex-direction: column; 
    border: 1px solid #333; 
}

.cover { 
    width: 100%; 
    aspect-ratio: 3/4; 
    background: #000; 
}

.cover img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
}

.meta { 
    padding: 1rem 1rem 0.5rem 1rem; 
}

.meta h3 {
    margin: 0 0 0.4rem 0;
    font-size: 1.2rem;
}

.meta .author { 
    color: #aab0bd; 
    font-size: 0.9rem;
    font-style: italic;
    margin-bottom: 0.6rem;
}

.meta .synopsis {
    font-size: 0.85rem;
    color: #c0c0c0;
    line-height: 1.4;
}

/* --- AÇÕES SEM A LINHA DE DIVISÃO --- */
.actions { 
    display: flex; 
    gap: .5rem; 
    padding: 0.8rem 1rem 1rem 1rem; 
    align-items: center; 
    /* A linha border-top foi removida daqui */
}

.btn { 
    padding: .5rem .8rem; 
    border-radius: 12px; 
    border: none; 
    cursor: pointer; 
    background: #000000; 
    color: #e7e9ee; 
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
}

.fav[aria-pressed="true"]::before { content: "★"; color: #ffd700; }
.fav[aria-pressed="false"]::before { content: "☆"; }

.star-count { 
    color: #ffffff;
    font-weight: bold;
}

.comment-section { margin-top: 2rem; background: #1a0901; padding: 1rem; border-radius: 12px; }
.comment-section textarea { width: 100%; height: 80px; background: #000; color: #fff; border: 1px solid #333; border-radius: 8px; padding: 0.5rem; box-sizing: border-box; }
.btn-comment { margin-top: 0.5rem; width: 100%; background: #000; color: white; padding: 0.6rem; border: none; border-radius: 8px; cursor: pointer; }

.drawer { position: fixed; inset:0; background: rgba(0,0,0,.95); display:flex; flex-direction:column; transform:translateY(100%); transition: transform .2s ease; z-index:50; }
.drawer.open { transform: translateY(0); }
.drawer-content { overflow-y:auto; padding:1rem; display:flex; flex-direction:column; align-items:center; }
.drawer-content img { width:100%; max-width: 800px; height:auto; margin-bottom:1rem; }
</style>
</head>
<body>

<header class="topbar">Biblioteca</header>

<div class="layout">
    <aside class="sidebar">
        <h2>Suas obras reunidas em um só lugar.</h2>
        <div class="comment-section">
            <h3>Deixe seu comentário</h3>
            <textarea placeholder="O que você está lendo hoje?"></textarea>
            <button class="btn-comment">Enviar</button>
        </div>
    </aside>
    <main class="main">
        <div id="grade" class="grid"></div>
    </main>
</div>

<div id="drawer" class="drawer" aria-hidden="true">
    <div class="topbar">
        <button class="btn" id="closeDrawer">Fechar</button>
        <h2 id="drawerTitle"></h2>
    </div>
    <div class="drawer-content"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

    
// 🔥 CONFIGURE AQUI
const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "sw-biblio.firebaseapp.com",
  databaseURL: "https://sw-biblio-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sw-biblio",
  appId: "SEU_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const livros = [
  {id:1, titulo:"Melissa", autor:"Wellington Novaes", capa:"Mellissa.png", pasta:"páginas compendio", totalPaginas:6, sinopse:"Uma jornada emocionante de descoberta e coragem."},
  {id:2, titulo:"Triohnte", autor:"Gabryell Aweryan", capa:"capaT.png", pasta:"Triohnte", totalPaginas:3, sinopse:"Um épico de fantasia sombria e intrigas políticas."},
  {id:3, titulo:"Virtudes", autor:"Francisco de Assis", capa:"Virtudes.png", pasta:"Virtudes", totalPaginas:3, sinopse:"Reflexões sobre a bondade e a espiritualidade."}
];

const grade = document.getElementById("grade");

livros.forEach(l => {
  const card = document.createElement("div");
  card.className = "card-book";
  card.innerHTML = `
    <div class="cover"><img src="${l.capa}"></div>
    <div class="meta">
      <h3>${l.titulo}</h3>
      <div class="author">Por: ${l.autor}</div>
      <div class="synopsis">${l.sinopse}</div>
    </div>
    <div class="actions">
      <button class="btn ler" data-id="${l.id}">Ler</button>
      <button class="btn fav" aria-pressed="false" data-id="${l.id}">
        <span class="star-count" id="stars-${l.id}">0</span>
      </button>
    </div>
  `;
  grade.appendChild(card);

  db.ref("estrelas/"+l.id).on("value", snap => {
    document.getElementById("stars-"+l.id).textContent = snap.val() || 0;
  });
});

grade.addEventListener("click", e => {
  const btnFav = e.target.closest(".fav");
  if(btnFav) {
    const id = btnFav.dataset.id;
    btnFav.setAttribute("aria-pressed", "true");
    db.ref("estrelas/"+id).transaction(v => (v || 0) + 1);
    return;
  }
  const btnLer = e.target.closest(".ler");
  if(btnLer) {
    const livro = livros.find(l => l.id == btnLer.dataset.id);
    if(livro) openDrawer(livro);
  }
});

function openDrawer(livro) {
    const drawer = document.getElementById("drawer");
    const content = document.querySelector(".drawer-content");
    document.getElementById("drawerTitle").textContent = livro.titulo;
    content.innerHTML = "";
    for(let i=1; i<=livro.totalPaginas; i++) {
        const img = document.createElement("img");
        img.src = `${livro.pasta}/Pagina ${i}.png`;
        content.appendChild(img);
    }
    drawer.classList.add("open");
}

document.getElementById("closeDrawer").onclick = () => {
    document.getElementById("drawer").classList.remove("open");
};


    // 💬 COMENTÁRIOS
// Renderiza últimos 20 comentários
db.ref("comentarios").limitToLast(20).once("value", snap=>{
    snap.forEach(c=>{
        addComment(c.val().texto, c.val().pais||"Desconhecido");
    });
});

// Renderiza novos comentários em tempo real
db.ref("comentarios").limitToLast(1).on("child_added", snap=>{
    addComment(snap.val().texto, snap.val().pais||"Desconhecido");
});

btnComment.onclick = () => {
    if(!textarea.value.trim()) return;
    db.ref("comentarios").push({
        texto: textarea.value,
        data: Date.now(),
        pais: userCountry
    });
    textarea.value = "";
};

function addComment(text, country){
    const p = document.createElement("p");
    p.innerHTML = `${text} <span class="comment-country">${country}</span>`;
    section.appendChild(p);
}

// 📖 DRAWER IMERSIVO
const drawer=document.getElementById("drawer");
const drawerContent=document.querySelector(".drawer-content");
const drawerTitle=document.getElementById("drawerTitle");
const closeDrawer=document.getElementById("closeDrawer");
const toggleReadingMode=document.getElementById("toggleReadingMode");
const zoomIn=document.getElementById("zoomIn");
const zoomOut=document.getElementById("zoomOut");
const pageInfo=document.getElementById("pageInfo");

let currentTotalPages=0;
let intersectionObserver=null;
let imageZoom=1;

function openDrawer(livro){
  drawerTitle.textContent=livro.titulo;
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden","false");
  drawerContent.innerHTML="";
  currentTotalPages=livro.totalPaginas;
  pageInfo.textContent=`1 de ${currentTotalPages}`;
  const pages=[];
  for(let i=1;i<=livro.totalPaginas;i++){
    const img=document.createElement("img");
    img.src=`${livro.pasta}/Pagina ${i}.png`;
    img.dataset.page=i;
    drawerContent.appendChild(img);
    pages.push(img);
  }
  if(intersectionObserver) intersectionObserver.disconnect();
  intersectionObserver=new IntersectionObserver(entries=>{
    let maxRatio=0,currentPage=1;
    entries.forEach(entry=>{
      if(entry.intersectionRatio>maxRatio){
        maxRatio=entry.intersectionRatio;
        currentPage=Number(entry.target.dataset.page);
      }
    });
    pageInfo.textContent=`${currentPage} de ${currentTotalPages}`;
  },{threshold:0.5});
  pages.forEach(p=>intersectionObserver.observe(p));
}

closeDrawer.onclick=()=>{
  drawer.classList.remove("open");
  drawer.setAttribute("aria-hidden","true");
  document.body.classList.remove("reading-mode");
}

toggleReadingMode.onclick=()=>{
  document.body.classList.toggle("reading-mode");
  toggleReadingMode.textContent=document.body.classList.contains("reading-mode")?"Sair do Slide":"Ver em Slide";
}

zoomIn.onclick=()=>{
  imageZoom=Math.min(2,imageZoom+0.1);
  drawerContent.style.transform=`scale(${imageZoom})`;
}
zoomOut.onclick=()=>{
  imageZoom=Math.max(0.5,imageZoom-0.1);
  drawerContent.style.transform=`scale(${imageZoom})`;
}

</script>
</body>
</html>
