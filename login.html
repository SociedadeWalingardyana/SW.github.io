<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login / Cadastro - Sociedade Walingardyana</title>
  <style>
    /* ... Seus estilos permanecem os mesmos ... */
    body, html { margin: 0; padding: 0; height: 100%; background-color: #000000; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; }
    .container { width: 320px; padding: 20px; background: #111; border-radius: 8px; box-shadow: 0 0 15px #2563eb33; border: 1px solid #222; }
    h2 { text-align: center; margin-bottom: 20px; color: #2563eb; }
    input[type="email"], input[type="password"] { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #333; border-radius: 4px; font-size: 14px; background-color: #000; color: white; box-sizing: border-box; }
    .buttons-row { display: flex; justify-content: space-between; }
    button { width: 48%; padding: 10px; border: none; border-radius: 4px; font-size: 14px; cursor: pointer; color: white; background-color: #2563eb; transition: background-color 0.3s; }
    button:hover { background-color: #1e40af; }
    #signupBtn { background-color: #374151; }
    #signupBtn:hover { background-color: #4b5563; }
    .message { margin-top: 15px; font-size: 13px; min-height: 20px; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <h2>Sociedade Walingardyana</h2>
  <input type="email" id="email" placeholder="E-mail" />
  <input type="password" id="password" placeholder="Senha" />
  
  <div class="buttons-row">
    <button id="loginBtn">Entrar</button>
    <button id="signupBtn">Cadastrar</button>
  </div>
  <div class="message" id="message"></div>

  <hr style="margin: 20px 0; border: 0; border-top: 1px solid #333;">
  <p style="font-size: 12px; text-align: center; color: #888;">Simular Compra (Teste):</p>
  <div style="display: flex; gap: 5px;">
     <button onclick="SW_Auth.comprarLivro(2)" style="width: 100%; background: #059669;">Comprar Triohnte</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  const SW_Auth = {
    config: {
      apiKey: "AIzaSyBPSH4g1rtk27n9wCCBJZ2GK1UKCMH-Yjs",
      authDomain: "login-sw-14940.firebaseapp.com",
      databaseURL: "https://sw-biblio-default-rtdb.europe-west1.firebasedatabase.app/",
      projectId: "login-sw-14940"
    },

    init: function() {
      if (!firebase.apps.length) {
        firebase.initializeApp(this.config);
      }
      this.db = firebase.database();
      this.auth = firebase.auth();
      this.bindEvents();
      this.observeAuthState();
    },

    // FUNÇÃO QUE LIBERA O LIVRO NA BIBLIOTECA
    comprarLivro: function(idLivro) {
      const user = this.auth.currentUser;
      if (!user) {
        alert("Acesse sua conta para realizar a compra.");
        return;
      }

      // Salva no nó de permissões que a Biblioteca verifica
      this.db.ref(`usuarios/${user.uid}/livros_comprados/${idLivro}`).set(true)
        .then(() => {
          alert("✅ Sucesso! Obra liberada na sua Biblioteca.");
        })
        .catch(err => alert("Erro: " + err.message));
    },

    observeAuthState: function() {
      this.auth.onAuthStateChanged((user) => {
        const msgDiv = document.getElementById('message');
        if (user) {
          this.loadUserData(user.uid);
          if(msgDiv) msgDiv.textContent = `Logado como: ${user.email}`;
        }
      });
    },

    loadUserData: function(uid) {
      this.db.ref('usuarios/' + uid).once('value').then((snapshot) => {
        const data = snapshot.val();
        if (data) {
          if(document.getElementById('db-nome')) document.getElementById('db-nome').value = data.nome || "";
          if(document.getElementById('db-pais')) document.getElementById('db-pais').value = data.pais || "";
          // ... outros campos
        }
      });
    },

    saveData: function() {
      const user = this.auth.currentUser;
      if (!user) return alert("Não autenticado.");

      const payload = {
        nome: document.getElementById('db-nome')?.value || "",
        pais: document.getElementById('db-pais')?.value || ""
      };

      // IMPORTANTE: usamos UPDATE para não apagar a lista de 'livros_comprados'
      this.db.ref('usuarios/' + user.uid).update(payload)
        .then(() => alert("Perfil atualizado!"))
        .catch((err) => alert("Erro: " + err.message));
    },

    bindEvents: function() {
      // Login Original
      document.getElementById('loginBtn')?.addEventListener('click', () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        this.auth.signInWithEmailAndPassword(e, p)
          .then(() => alert("Bem-vindo!"))
          .catch(err => alert(err.message));
      });

      // Cadastro Original
      document.getElementById('signupBtn')?.addEventListener('click', () => {
        const e = document.getElementById('email').value;
        const p = document.getElementById('password').value;
        this.auth.createUserWithEmailAndPassword(e, p)
          .then(() => alert("Conta criada!"))
          .catch(err => alert(err.message));
      });
    }
  };

  SW_Auth.init();
</script>

</body>
</html>
