<script>
    const mp = new MercadoPago('APP_USR-6e5e23d3-3ec7-40b2-98b1-ce3c41e46d3a', {
        locale: 'pt-BR'
    });

    async function carregarBotao() {
        try {
            const response = await fetch('/api/checkout');
            const data = await response.json();

            if (!data.id) throw new Error("ID não gerado");

            mp.bricks().create("wallet", "walletWidget", {
                initialization: {
                    preferenceId: data.id,
                },
                customization: {
                    texts: { valueProp: 'smart_option', action: 'pay' },
                },
                callbacks: {
                    onReady: () => {},
                    onSubmit: () => {
                        // Simula o registro da venda ao clicar no botão
                        // Em um sistema real, isso seria feito via Webhook para segurança
                        registrarVendaLocal();
                    },
                    onError: (error) => console.error(error),
                },
            });
        } catch (err) {
            console.error("Erro ao carregar Mercado Pago:", err);
        }
    }

    function registrarVendaLocal() {
        const vendas = JSON.parse(localStorage.getItem('vendas')) || [];
        const novaVenda = {
            book: "Segredários",
            user: "Cliente Web", // Opcional: capturar nome do input se houver
            country: "Brasil",
            valor: 7.00,
            data: new Date().toLocaleString()
        };
        vendas.push(novaVenda);
        localStorage.setItem('vendas', JSON.stringify(vendas));
    }

    carregarBotao();
</script>
