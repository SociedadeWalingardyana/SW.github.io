<script>
        // Inicialização única do Mercado Pago
        const mp = new MercadoPago('APP_USR-6e5e23d3-3ec7-40b2-98b1-ce3c41e46d3a', {
            locale: 'pt-BR'
        });

        async function carregarBotao() {
            try {
                // Busca o ID da preferência gerado na sua API Vercel
                const response = await fetch('/api/checkout');
                const data = await response.json();

                if (!data.id) throw new Error("ID não gerado");

                mp.bricks().create("wallet", "walletWidget", {
                    initialization: {
                        preferenceId: data.id,
                    },
                    customization: {
                        texts: { 
                            valueProp: 'smart_option', 
                            action: 'pay' 
                        },
                    },
                    callbacks: {
                        onReady: () => {
                            console.log("Botão Mercado Pago pronto.");
                        },
                        onSubmit: () => {
                            // Esta função salva os dados localmente quando o usuário inicia o pagamento
                            registrarVendaLocal();
                        },
                        onError: (error) => {
                            console.error("Erro no Brick:", error);
                        },
                    },
                });
            } catch (err) {
                console.error("Erro ao carregar Mercado Pago:", err);
            }
        }

        // Função para conectar os dados ao SW Sistem via localStorage
        function registrarVendaLocal() {
            const vendas = JSON.parse(localStorage.getItem('vendas')) || [];
            const novaVenda = {
                book: "Segredários",
                user: "Venda Direta", 
                country: "Brasil",
                valor: 7.00,
                data: new Date().toLocaleString('pt-BR')
            };
            vendas.push(novaVenda);
            localStorage.setItem('vendas', JSON.stringify(vendas));
        }

        // Executa a carga do botão
        carregarBotao();
    </script>
</body>
</html>
