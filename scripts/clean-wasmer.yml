name: Clean Wasmer Deployments

on:
  workflow_dispatch:  # permite rodar manualmente pelo GitHub
  # Se quiser que rode a cada push na main, descomente:
  # push:
  #   branches: [ "main" ]

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar Wasmer
        run: |
          curl https://get.wasmer.io -sSfL | sh
          echo "$HOME/.wasmer/bin" >> $GITHUB_PATH

      - name: Instalar jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Login no Wasmer
        run: wasmer login --token "${{ secrets.WASMER_TOKEN }}"

      - name: Listar Deployments
        run: wasmer deploy list --json

      - name: Limpar Deployments Antigos
        run: |
          echo "Limpando deployments..."
          wasmer deploy list --json | jq -r '.[].id' | while read id; do
            echo "Apagando $id..."
            wasmer deploy delete "$id"
          done
