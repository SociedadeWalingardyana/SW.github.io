<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sociedade Walingardyana</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
  
  <style>
    body {
      background-color: #281109 !important;
      color: #FFFFFF;
      font-family: sans-serif;
      text-align: justify;
      margin: 0;
    }

    .titulo-cinzel {
      font-family: 'Cinzel', serif;
      font-size: 3rem;
      text-align: center;
      margin-bottom: 2rem;
      line-height: 1.2;
    }

    /* Botões Superiores */
    .top-button {
      position: fixed;
      top: 10px;
      background: #1a1a1a;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      border: 1px solid #333;
    }
    
    .top-button:hover { background: #333; }

    /* Saudação do Usuário */
    #user-greeting {
      position: fixed;
      top: 10px;
      right: 170px;
      color: #ffd700;
      font-weight: bold;
      z-index: 10001; /* Camada acima do botão para garantir visibilidade */
      background: #1a1a1a;
      padding: 5px 15px;
      border-radius: 5px;
      display: none; 
      border: 1px solid #ffd700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    header, footer { background-color: black; }
  </style>
</head>
<body>

  <div id="user-greeting"></div>
  <button id="login-btn" class="top-button" style="right: 170px; padding: 5px 15px;">Login</button>
  
  <div id="direct-colab" class="top-button" style="right: 50px; padding: 5px 10px;">Direct Colab</div>
  <div id="language-selector" class="top-button" style="right: 10px; width: 30px; height: 35px;">▼</div>

  <header class="p-4 shadow-md">
    <div class="container mx-auto flex flex-col items-center">
      <img src="oficial.png" alt="Logo" class="w-32 h-auto mb-2" />
      <h1 class="text-2xl font-bold">Sociedade Walingardyana</h1>
      <nav class="flex gap-4 mt-2">
        <a href="novidades.html" class="hover:underline">Notícias</a>
        <a href="loja.html" class="hover:underline">Loja</a>
        <a href="autores.html" class="hover:underline">Nossos Autores</a>
        <a href="Biblioteca.html" class="hover:underline">Biblioteca</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto mt-12 px-6 max-w-4xl">
    <h2 class="titulo-cinzel">Origem da Sociedade Walingardyana</h2>
    <p>A Sociedade Walingardyana foi criada em dezembro de 2022 por Gabriel Aquino...</p>
    </main>

  <footer class="text-center p-8 mt-16">
    <p>&copy; 2025 Sociedade Walingardyana. Todos os direitos reservados.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script>
    // 1. Configuração (Substitua pelos seus dados reais)
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO",
      appId: "SEU_APP_ID"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // 2. Lógica de Verificação de Usuário
    auth.onAuthStateChanged((user) => {
      const loginBtn = document.getElementById('login-btn');
      const greeting = document.getElementById('user-greeting');

      if (user) {
        console.log("Usuário detectado:", user.email);
        
        // Esconde o botão de login de forma agressiva
        loginBtn.setAttribute('style', 'display: none !important');
        
        // Trata o nome de exibição
        const emailBase = user.email.split('@')[0];
        const formatName = emailBase.length > 8 ? emailBase.substring(0, 8) + "..." : emailBase;
        
        greeting.innerHTML = `Olá, ${formatName}`;
        greeting.style.display = 'block';
      } else {
        console.log("Nenhum usuário logado.");
        loginBtn.style.display = 'flex';
        greeting.style.display = 'none';
      }
    });

    // 3. Redirecionamentos e Cadastro para Compras
    document.getElementById('login-btn').onclick = () => {
      window.location.href = 'login.html';
    };

    // Exemplo de bloqueio para loja (opcional)
    document.querySelector('a[href="loja.html"]').onclick = (e) => {
      if (!auth.currentUser) {
        e.preventDefault();
        alert("Para comprar livros, você precisa estar logado!");
        window.location.href = 'login.html';
      }
    };
  </script>
</body>
</html>
