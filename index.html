<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SW Editorial</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

<style>
body{background:#281109;color:#fff;margin:0}
.titulo-cinzel{font-family:'Cinzel',serif;font-size:3rem;text-align:center;margin-bottom:2rem}
.top-button{position:absolute;top:10px;background:#1a1a1a;color:white;border-radius:5px;cursor:pointer;font-weight:bold;z-index:100;border:1px solid #333;text-decoration:none}
.top-button:hover{background:#333}
header,footer{background:black}
.cover img{display:block;margin:4rem auto;max-width:100%}
</style>
</head>

<body>

<a href="SW Sistem.html" class="top-button" style="right:50px;padding:5px 10px;">Direct Colab</a>

<div class="absolute top-2 z-50 font-sans flex items-center gap-2" style="right:180px;">
<div id="auth-container" class="flex items-center gap-2 bg-black bg-opacity-60 p-1.5 rounded-lg border border-gray-800">
<input id="email-field" type="email" placeholder="E-mail" class="px-2 py-1 text-sm rounded w-32 text-black outline-none">
<input id="pass-field" type="password" placeholder="Senha" class="px-2 py-1 text-sm rounded w-28 text-black outline-none">
<div class="flex gap-1">
<button id="login-btn" class="bg-yellow-600 text-white px-3 py-1 rounded text-sm font-bold">Entrar</button>
<button id="signup-btn" class="bg-yellow-600 text-white px-3 py-1 rounded text-sm font-bold">Registrar</button>
</div>
</div>

<div id="user-info" class="hidden relative">
<div id="user-greeting" class="bg-black text-yellow-500 px-4 py-1 rounded-lg font-bold border border-yellow-600 cursor-pointer">
Carregando...
</div>
<div id="settings-dropdown" class="hidden absolute top-full right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border overflow-hidden z-50">
<button id="btn-abrir-modal" class="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 border-b">Alterar dados</button>
<button id="logout-btn" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 font-bold">Sair</button>
</div>
</div>
</div>

<div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center p-4" style="z-index:9999;">
<div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm">
<h3 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2 italic">Configurações</h3>
<input id="db-nome" placeholder="Nome" class="w-full border p-2 mb-2 rounded text-black">
<input id="db-idade" placeholder="Idade" class="w-full border p-2 mb-2 rounded text-black">
<input id="db-cpf" placeholder="CPF" class="w-full border p-2 mb-2 rounded text-black">
<input id="db-endereco" placeholder="Endereço" class="w-full border p-2 mb-2 rounded text-black">
<input id="db-pais" placeholder="País" class="w-full border p-2 mb-2 rounded text-black">
<div class="flex gap-2 mt-4">
<button id="btn-salvar" class="bg-green-700 text-white flex-1 py-2 rounded">Salvar</button>
<button id="btn-fechar" class="bg-gray-300 flex-1 py-2 rounded">Voltar</button>
</div>
</div>
</div>

<header class="p-4">
<div class="container mx-auto flex flex-col items-center">
<img src="oficial.png" class="w-32 mb-2">
<h1 class="text-2xl font-bold">SW Editorial</h1>
</div>
</header>

<footer class="flex justify-center p-8 mt-16">
<p>&copy; 2025 SW Editorial</p>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>

const firebaseConfig={
apiKey:"AIzaSyBPSH4g1rtk27n9wCCBJZ2GK1UKCMH-Yjs",
authDomain:"login-sw-14940.firebaseapp.com",
databaseURL:"https://sw-biblio-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"login-sw-14940",
appId:"1:252978150700:web:2c7d3997389f7675058089"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();

let ref=null;

auth.onAuthStateChanged(user=>{
const ac=document.getElementById('auth-container');
const ui=document.getElementById('user-info');
const ug=document.getElementById('user-greeting');

if(ref)ref.off();

if(!user){ac.classList.remove('hidden');ui.classList.add('hidden');return;}

ac.classList.add('hidden');
ui.classList.remove('hidden');

ref=db.ref('usuarios/'+user.uid);

ref.once('value',snap=>{
let d=snap.val();
ug.textContent="Olá, "+(d?.nome?.split(' ')[0]||user.email.split('@')[0]);
document.getElementById('db-nome').value=d?.nome||"";
document.getElementById('db-idade').value=d?.idade||"";
document.getElementById('db-cpf').value=d?.cpf||"";
document.getElementById('db-endereco').value=d?.endereco||"";
document.getElementById('db-pais').value=d?.pais||"";
});
});

login-btn.onclick=()=>auth.signInWithEmailAndPassword(email-field.value,pass-field.value);

signup-btn.onclick=()=>{
auth.createUserWithEmailAndPassword(email-field.value,pass-field.value)
.then(u=>db.ref('usuarios/'+u.user.uid).set({nome:"Usuário"}));
};

btn-salvar.onclick=()=>{
let u=auth.currentUser;
if(!u)return;
db.ref('usuarios/'+u.uid).update({
nome:db-nome.value,
idade:db-idade.value,
cpf:db-cpf.value,
endereco:db-endereco.value,
pais:db-pais.value
}).then(()=>{
edit-modal.classList.replace('flex','hidden');
});
};

user-greeting.onclick=e=>{
e.stopPropagation();
settings-dropdown.classList.toggle('hidden');
};

btn-abrir-modal.onclick=()=>{
edit-modal.classList.replace('hidden','flex');
};

btn-fechar.onclick=()=>{
edit-modal.classList.replace('flex','hidden');
};

logout-btn.onclick=()=>auth.signOut();

window.addEventListener('click',()=>{
settings-dropdown.classList.add('hidden');
});

</script>
</body>
</html>
