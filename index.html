<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Define o tipo de documento como HTML5 -->
  <meta charset="UTF-8">
  
  <!-- Garante que o site será responsivo em qualquer tela -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Título da aba do navegador -->
  <title>Sociedade Walingardyana</title>
  
  <!-- Importa o TailwindCSS para estilização rápida -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Ícone que aparece na aba do navegador -->
  <link rel="icon" href="Compendio.png">
  
  <!-- Estilos personalizados -->
  <style>
    body {
      background-color: #281109 !important; /* Cor de fundo do site */
      color: #FFFFFF; /* Cor padrão do texto */
    }
  </style>
</head>

<body class="flex flex-col min-h-screen items-center justify-center text-center">
  <!-- Corpo principal do site, centralizado vertical e horizontalmente -->

  <header class="mb-8">
    <!-- Cabeçalho do site -->
    <img src="Compendio.png" alt="Logo da Sociedade Walingardyana" class="w-40 mx-auto mb-4">
    <!-- Logo centralizada -->
    
    <h1 class="text-3xl font-bold">Sociedade Walingardyana</h1>
    <!-- Título principal -->
    
    <p class="text-sm opacity-80">O legado de Gabryell Aweryan</p>
    <!-- Subtítulo / descrição curta -->
  </header>

  <main class="flex flex-col items-center gap-6">
    <!-- Conteúdo principal da página -->
    
    <nav class="flex flex-wrap gap-4 justify-center mt-2">
      <!-- Menu de navegação -->
      
      <!-- Cada link leva a uma página específica do site -->
      <a id="nav-novidades" href="novidades.html" class="hover:underline">Notícias</a>
      <!-- Link para a página de notícias -->
      
      <a id="nav-loja" href="loja.html" class="hover:underline">Loja</a>
      <!-- Link para a loja -->
      
      <a id="nav-autores" href="gabryell.html" class="hover:underline">Nossos Autores</a>
      <!-- Link que leva para a página de autores (gabryell.html) -->
      
      <a id="nav-biblioteca" href="Biblioteca.html" class="hover:underline">Biblioteca</a>
      <!-- Link para a biblioteca -->
    </nav>

    <section class="mt-6 max-w-md">
      <!-- Seção com o texto de boas-vindas -->
      <p class="text-lg">
        Bem-vindo à Sociedade Walingardyana.  
        Aqui preservamos o legado, a história e a chama que inspirou gerações.
      </p>
    </section>
  </main>

  <footer class="mt-auto py-4 text-sm opacity-60">
    <!-- Rodapé do site -->
    <p>© 2025 Sociedade Walingardyana. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
