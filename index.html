<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sociedade Walingardyana</title>

  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #281109 !important;
      color: #FFFFFF;
      font-family: sans-serif;
      text-align: justify;
      margin: 0;
      padding: 0;
    }

    .titulo-cinzel {
      font-family: 'Cinzel', serif;
      font-size: 3rem;
      text-align: center;
      margin-bottom: 2rem;
      line-height: 1.2;
      color: #FFFFFF;
    }

    p {
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .top-button {
      position: fixed;
      top: 10px;
      background: #1a1a1a;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      border: 1px solid #333;
    }

    .top-button:hover { background: #333; }

    header, footer { background-color: black; }

    .cover img {
      display: block;
      margin: 4rem auto;
      max-width: 100%;
    }
  </style>
</head>

<body>

<!-- 🔐 AUTENTICAÇÃO / MEMBROS -->
<div class="fixed top-4 right-4 z-50 font-sans">

  <div id="auth-container" class="flex gap-2 bg-black bg-opacity-50 p-2 rounded-lg backdrop-blur-sm">
    <input type="email" id="email-field" placeholder="E-mail" class="px-3 py-1 text-sm rounded border-none outline-none w-40 text-black">
    <input type="password" id="pass-field" placeholder="Senha" class="px-3 py-1 text-sm rounded border-none outline-none w-32 text-black">
    <button id="login-btn" class="bg-yellow-600 hover:bg-yellow-700 text-white text-sm font-bold px-4 py-1 rounded transition">
      Entrar
    </button>
  </div>

  <div id="user-info" class="hidden flex flex-col items-end">
    <div id="user-greeting" class="bg-black bg-opacity-70 text-yellow-500 px-4 py-1 rounded-t-lg font-bold cursor-pointer border border-yellow-600 border-b-0">
    </div>
    <div id="settings-dropdown" class="hidden bg-white text-gray-800 shadow-xl rounded-b-lg rounded-tl-lg overflow-hidden border border-yellow-600 w-48">
      <button id="btn-abrir-modal" class="block w-full text-left px-4 py-2 hover:bg-gray-100 border-b text-sm">
        Alterar Meus Dados
      </button>
      <button id="logout-btn" class="block w-full text-left px-4 py-2 hover:bg-red-50 text-red-600 text-sm font-bold">
        Sair
      </button>
    </div>
  </div>
</div>

<!-- 📝 MODAL DE DADOS -->
<div id="edit-modal" class="fixed inset-0 bg-black bg-opacity-80 hidden items-center justify-center z-[60] p-4 font-sans">
  <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-sm">
    <h3 class="text-xl font-bold mb-4 text-gray-800 border-b pb-2 italic">
      Configurações de Membro
    </h3>

    <div class="space-y-3">
      <input id="db-nome" placeholder="Nome Completo" class="w-full border p-2 rounded">
      <input id="db-idade" placeholder="Idade" class="w-full border p-2 rounded">
      <input id="db-cpf" placeholder="CPF" class="w-full border p-2 rounded">
      <input id="db-endereco" placeholder="Endereço" class="w-full border p-2 rounded">
      <input id="db-pais" placeholder="País" class="w-full border p-2 rounded">
    </div>

    <div class="flex gap-2 mt-6">
      <button id="btn-salvar-realtime" class="bg-green-700 hover:bg-green-800 text-white flex-1 py-2 rounded font-bold">
        Salvar
      </button>
      <button id="btn-fechar-modal" class="bg-gray-300 hover:bg-gray-400 flex-1 py-2 rounded">
        Voltar
      </button>
    </div>
  </div>
</div>

<!-- 🔥 FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyBPSH4g1rtk27n9wCCBJZ2GK1UKCMH-Yjs",
    authDomain: "login-sw-14940.firebaseapp.com",
    databaseURL: "https://sw-biblio-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "login-sw-14940",
    storageBucket: "login-sw-14940.firebasestorage.app",
    messagingSenderId: "252978150700",
    appId: "1:252978150700:web:2c7d3997389f7675058089"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  auth.onAuthStateChanged(user => {
    if (user) {
      auth-container.classList.add('hidden');
      user-info.classList.remove('hidden');
      user-greeting.textContent = `Olá, ${user.email.split('@')[0]}`;

      db.ref('usuarios/' + user.uid).once('value', s => {
        const d = s.val() || {};
        db-nome.value = d.nome || '';
        db-idade.value = d.idade || '';
        db-cpf.value = d.cpf || '';
        db-endereco.value = d.endereco || '';
        db-pais.value = d.pais || '';
      });
    }
  });

  login-btn.onclick = () =>
    auth.signInWithEmailAndPassword(email-field.value, pass-field.value)
      .catch(e => alert(e.message));

  user-greeting.onclick = e => {
    e.stopPropagation();
    settings-dropdown.classList.toggle('hidden');
  };

  btn-abrir-modal.onclick = () => {
    edit-modal.classList.replace('hidden', 'flex');
    settings-dropdown.classList.add('hidden');
  };

  btn-fechar-modal.onclick = () =>
    edit-modal.classList.replace('flex', 'hidden');

  btn-salvar-realtime.onclick = () => {
    const u = auth.currentUser;
    db.ref('usuarios/' + u.uid).set({
      nome: db-nome.value,
      idade: db-idade.value,
      cpf: db-cpf.value,
      endereco: db-endereco.value,
      pais: db-pais.value
    }).then(() => alert("Dados salvos com sucesso."));
  };

  logout-btn.onclick = () =>
    auth.signOut().then(() => location.reload());

  window.onclick = () =>
    settings-dropdown.classList.add('hidden');
</script>

</body>
</html>
