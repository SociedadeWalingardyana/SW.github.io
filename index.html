<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sociedade Walingardyana</title>

<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

<style>
body {
  background:#281109;
  color:#fff;
  font-family:sans-serif;
  text-align:justify;
}
#boas-vindas {
  font-family:'Cinzel', serif;
  font-size:3rem;
  text-align:center;
  margin-bottom:2rem;
}
p { margin-bottom:20px; }
</style>
</head>

<body>

<header class="bg-black p-4 shadow-md relative">
  <div class="container mx-auto text-center">
    <img src="oficial.png" class="w-32 mx-auto mb-2">
    <h1 class="text-2xl font-bold">Sociedade Walingardyana</h1>
    <nav class="flex justify-center gap-4 mt-2">
      <a href="novidades.html">Notícias</a>
      <a href="loja.html">Loja</a>
      <a href="autores.html">Nossos Autores</a>
      <a href="Biblioteca.html">Biblioteca</a>
    </nav>
  </div>

  <!-- LOGIN ÚNICO -->
  <div class="absolute top-4 right-4 bg-black bg-opacity-80 p-3 rounded space-y-2 text-sm">
    <input id="email" placeholder="Email ou Nome"
      class="w-48 px-2 py-1 rounded text-black">
    <input id="senha" type="password" placeholder="Senha (cliente)"
      class="w-48 px-2 py-1 rounded text-black">
    <input id="codigo" placeholder="Código (colaborador)"
      class="w-48 px-2 py-1 rounded text-black">
    <button onclick="login()" class="w-full bg-red-700 hover:bg-red-800 py-1 rounded">
      Entrar
    </button>
  </div>
</header>

<section class="container mx-auto mt-10 text-lg">
  <p id="boas-vindas">Origem da Sociedade Walingardyana</p>
  <p>
    A Sociedade Walingardyana foi criada em dezembro de 2022 por Gabriel Aquino,
    com o objetivo de proteger, expandir e consolidar um legado literário próprio.
  </p>
</section>

<footer class="bg-black text-center p-4 mt-16">
  <p>&copy; 2025 Sociedade Walingardyana</p>
</footer>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
/* CONFIG FIREBASE */
firebase.initializeApp({
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_PROJETO.firebaseapp.com",
  projectId: "SEU_PROJETO",
  appId: "SEU_APP_ID"
});
const auth = firebase.auth();

/* COLABORADORES */
const colaboradores = {
  "987321W": "Wellington",
  "287432A": "Agatha",
  "342190G": "Gabriel",
  "21356AR": "Ariosto"
};

/* LOGIN INTELIGENTE */
function login() {
  const emailOuNome = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;
  const codigo = document.getElementById("codigo").value.trim();

  /* COLABORADOR */
  if (codigo !== "") {
    if (
      colaboradores[codigo] &&
      colaboradores[codigo].toLowerCase() === emailOuNome.toLowerCase()
    ) {
      window.location.href = "SW Sistem.html";
      return;
    } else {
      alert("Nome ou código inválido.");
      return;
    }
  }

  /* CLIENTE */
  auth.signInWithEmailAndPassword(emailOuNome, senha)
    .then(() => {
      alert("Login realizado com sucesso.");
    })
    .catch(err => {
      alert("Erro: " + err.message);
    });
}
</script>

</body>
</html>
