<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SW Sistem</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#000000;color:#eaeaea}
.hidden{display:none}
#login,#app{min-height:100vh}
.center{display:flex;align-items:center;justify-content:center}
.card{background:#1a0a00;padding:1.5rem;border-radius:14px;margin-bottom:1rem}
input,textarea,button{width:100%;padding:.7rem;border-radius:10px;border:none;margin-top:.5rem}
button{background:#ffffff;font-weight:bold;cursor:pointer}
.top{display:flex;gap:1rem;padding:1rem;background:#1a0a00;flex-wrap:wrap}
.tab{cursor:pointer;opacity:.6}
.tab.active{opacity:1;font-weight:bold}
.section{display:none;padding:1rem}
.section.active{display:block}
#map{height:420px;border-radius:12px}
.small{font-size:.85rem;opacity:.7}
.forum-post{border-bottom:1px solid #1a0a00;padding:.5rem 0}
iframe{width:100%;height:420px;border:none;border-radius:12px}
</style>
</head>
<body>

<!-- Login -->
<div id="login" class="center">
  <div class="card" style="width:320px">
    <h2>SW Sistem</h2>
    <input id="code" placeholder="Código de acesso">
    <button onclick="login()">Entrar</button>
    <p id="error" class="small"></p>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <div class="top">
    <div class="tab active" onclick="openTab('demo',this)">Demografia</div>
    <div class="tab" onclick="openTab('fin',this)">Finanças</div>
    <div class="tab" onclick="openTab('plan',this)">Planejamentos</div>
    <div class="tab" onclick="openTab('conf',this)">Conferência</div>
  </div>

  <!-- Demografia -->
  <div id="demo" class="section active">
    <div class="card">
      <h3>Leitores Globais</h3>
      <div id="map"></div>
      <p class="small">Simulação em tempo real (pronto para Analytics real)</p>
    </div>
  </div>

  <!-- Finanças -->
  <div id="fin" class="section">
    <div class="card">
      <h3>Histórico de Vendas</h3>
      <ul id="sales"></ul>
    </div>
  </div>

  <!-- Planejamentos / Fórum -->
  <div id="plan" class="section">
    <div class="card">
      <h3>Fórum Interno</h3>
      <textarea id="idea" placeholder="Nova ideia ou planejamento..."></textarea>
      <button onclick="postIdea()">Publicar</button>
      <div id="forum"></div>
    </div>
  </div>

  <!-- Conferência -->
  <div id="conf" class="section">
    <div class="card">
      <h3>Conferência SW</h3>
      <button onclick="startCall()">Iniciar Sala</button>
      <div id="callArea" class="hidden" style="margin-top:1rem">
        <iframe id="callFrame"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
/* Usuários do sistema */
const users={
  '987321W':'Welligton',
  '342190G':'Gabriel',
  '21356AR':'Ariosto'
};
let currentUser='';

/* Login */
function login(){
  const code=document.getElementById('code').value.trim();
  if(users[code]){
    currentUser=users[code];
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    initMap(); loadSales();
  }else{
    document.getElementById('error').innerText='Código inválido';
  }
}

/* Abrir abas */
function openTab(id,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(id).classList.add('active');
  if(id==='fin') loadSales(); // atualiza vendas ao abrir a aba
}

/* Mapa de leitores */
let map;
function initMap(){
  map=L.map('map').setView([20,0],2);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  setInterval(()=>{
    const lat=Math.random()*140-70;
    const lng=Math.random()*360-180;
    const pct=(Math.random()*5+1).toFixed(2);
    L.circle([lat,lng],{radius:500000,color:'#e7c46a'})
      .addTo(map)
      .bindPopup(pct+'% dos leitores ativos');
  },3000);
}

/* Carregar histórico de vendas da loja.html via localStorage */
function loadSales(){
  const ul=document.getElementById('sales');
  ul.innerHTML=''; // limpa lista
  const vendas = JSON.parse(localStorage.getItem('vendas')) || [];
  vendas.forEach(s=>{
    const li=document.createElement('li');
    li.textContent=`${s.book} – ${s.user} (${s.country})`;
    ul.appendChild(li);
  });
}

/* Fórum interno */
function postIdea(){
  const t=document.getElementById('idea');
  if(!t.value.trim())return;
  const d=document.createElement('div');
  d.className='forum-post';
  d.innerHTML=`<strong>${currentUser}</strong>: ${t.value}`;
  document.getElementById('forum').prepend(d);
  t.value='';
}

/* Conferência */
function startCall(){
  const room='SW-'+Math.random().toString(36).substring(2,8);
  const url=`https://meet.jit.si/${room}#userInfo.displayName=${currentUser}`;
  document.getElementById('callArea').classList.remove('hidden');
  document.getElementById('callFrame').src=url;
}
</script>

</body>
</html>
