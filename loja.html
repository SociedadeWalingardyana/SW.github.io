        >

        <div class="mb-5">

  <!-- ========================================================= -->

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>


  <script>

    /* =========================================================
       CONFIGURAÇÃO FIREBASE
       ========================================================= */

    const firebaseConfig = {

      apiKey: "AIzaSyBPSH4g1rtk27n9wCCBJZ2GK1UKCMH-Yjs",

      authDomain:
        "login-sw-14940.firebaseapp.com",

      databaseURL:
        "https://login-sw-14940-default-rtdb.europe-west1.firebasedatabase.app/",

      projectId:
        "login-sw-14940",

      appId:
        "1:252978150700:web:2c7d3997389f7675058089"

    };


    /* =========================================================
       INICIALIZAR FIREBASE
       ========================================================= */

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();

    const db = firebase.database();


    /* =========================================================
       ELEMENTOS
       ========================================================= */

    const selector =
      document.getElementById("language-selector");

    const list =
      document.getElementById("language-list");

    const botaoCompra =
      document.getElementById("botao-pdf");

    const statusUsuario =
      document.getElementById("status-usuario");

    const mensagem =
      document.getElementById("mensagem");


    /* =========================================================
       SISTEMA DE MENSAGEM
       ========================================================= */

    function mostrarMensagem(texto, tempo = 3000) {

      mensagem.textContent = texto;

      mensagem.style.display = "block";

      setTimeout(() => {

        mensagem.style.display = "none";

      }, tempo);

    }


    /* =========================================================
       IDIOMAS
       ========================================================= */

    const traducoes = {

      pt: {

        tituloPrincipal:
          "Loja",

        subtitulo:
          "Obras e publicações da Sociedade Walingardyana",

        produtoTitulo:
          "Segredários",

        produtoTipo:
          "Novel",

        produtoDesc:
          "Download desabilitado pela proteção de dados.",

        produtoPreco:
          "R$ 1,99",

        produtoAutor:
          "De: Gabryell Aweryan",

        botaoComprar:
          "Comprar",

        linkVoltar:
          "← Voltar para a página inicial",

        verificando:
          "Verificando sessão...",

        conectado:
          "Você está conectado.",

        desconectado:
          "Você precisa estar conectado para comprar.",

        login:
          "Faça login para continuar.",

        encaminhando:
          "Encaminhando para a página de compra...",

        erro:
          "Não foi possível iniciar a compra."

      },


      en: {

        tituloPrincipal:
          "Store",

        subtitulo:
          "Works and publications from the Walingardyana Society",

        produtoTitulo:
          "Segredários",

        produtoTipo:
          "Novel",

        produtoDesc:
          "Download disabled by data protection.",

        produtoPreco:
          "R$ 1.99",

        produtoAutor:
          "By: Gabryell Aweryan",

        botaoComprar:
          "Buy Now",

        linkVoltar:
          "← Back to the homepage",

        verificando:
          "Checking session...",

        conectado:
          "You are signed in.",

        desconectado:
          "You need to sign in to purchase.",

        login:
          "Please sign in to continue.",

        encaminhando:
          "Redirecting to the purchase page...",

        erro:
          "Unable to start the purchase."

      },


      es: {

        tituloPrincipal:
          "Tienda",

        subtitulo:
          "Obras y publicaciones de la Sociedad Walingardyana",

        produtoTitulo:
          "Segredários",

        produtoTipo:
          "Novela",

        produtoDesc:
          "Descarga deshabilitada por protección de datos.",

        produtoPreco:
          "R$ 1,99",

        produtoAutor:
          "De: Gabryell Aweryan",

        botaoComprar:
          "Comprar",

        linkVoltar:
          "← Volver a la página principal",

        verificando:
          "Verificando sesión...",

        conectado:
          "Has iniciado sesión.",

        desconectado:
          "Debes iniciar sesión para comprar.",

        login:
          "Inicia sesión para continuar.",

        encaminhando:
          "Redirigiendo a la página de compra...",

        erro:
          "No se pudo iniciar la compra."

      }

    };


    /* =========================================================
       IDIOMA ATUAL
       ========================================================= */

    let idiomaAtual =
      localStorage.getItem("idioma") || "pt";


    /* =========================================================
       APLICAR IDIOMA
       ========================================================= */

    function setLanguage(lang) {

      if (!traducoes[lang]) {
        lang = "pt";
      }

      idiomaAtual = lang;

      const t =
        traducoes[lang];


      document.documentElement.lang =
        lang === "pt"
          ? "pt-BR"
          : lang;


      document.title =
        t.tituloPrincipal +
        " - Sociedade Walingardyana";


      document.getElementById(
        "titulo-principal"
      ).textContent =
        t.tituloPrincipal;


      document.getElementById(
        "subtitulo"
      ).textContent =
        t.subtitulo;


      document.getElementById(
        "produto-1-titulo"
      ).textContent =
        t.produtoTitulo;


      document.getElementById(
        "produto-1-tipo"
      ).textContent =
        t.produtoTipo;


      document.getElementById(
        "produto-1-desc"
      ).textContent =
        t.produtoDesc;


      document.getElementById(
        "produto-1-preco"
      ).textContent =
        t.produtoPreco;


      document.getElementById(
        "produto-1-autor"
      ).textContent =
        t.produtoAutor;


      document.getElementById(
        "botao-pdf"
      ).textContent =
        t.botaoComprar;


      document.getElementById(
        "link-voltar"
      ).textContent =
        t.linkVoltar;


      localStorage.setItem(
        "idioma",
        lang
      );


      atualizarStatusUsuario();
    }


    /* =========================================================
       MENU DE IDIOMAS
       ========================================================= */

    selector.addEventListener(
      "click",
      function(event) {

        event.stopPropagation();

        const aberto =
          list.style.display === "block";

        list.style.display =
          aberto
            ? "none"
            : "block";

      }
    );


    document.addEventListener(
      "click",
      function(event) {

        if (
          !selector.contains(event.target) &&
          !list.contains(event.target)
        ) {

          list.style.display =
            "none";

        }

      }
    );


    document
      .querySelectorAll(".idioma-item")
      .forEach(function(item) {

        item.addEventListener(
          "click",
          function() {

            const idioma =
              this.dataset.lang;

            setLanguage(idioma);

            list.style.display =
              "none";

          }
        );

      });


    /* =========================================================
       ESTADO DO LOGIN
       ========================================================= */

    let usuarioAtual = null;


    /*
      IMPORTANTE:

      Não usamos apenas auth.currentUser no carregamento.

      O Firebase pode ainda estar restaurando
      a sessão do usuário.

      Por isso usamos onAuthStateChanged().
    */

    auth.onAuthStateChanged(
      function(user) {

        usuarioAtual = user;

        atualizarStatusUsuario();

      }
    );


    /* =========================================================
       ATUALIZAR STATUS DO USUÁRIO
       ========================================================= */

    function atualizarStatusUsuario() {

      if (!statusUsuario) {
        return;
      }

      const t =
        traducoes[idiomaAtual] ||
        traducoes.pt;


      if (usuarioAtual) {

        statusUsuario.textContent =
          t.conectado;

        statusUsuario.className =
          "text-center mt-8 text-sm text-green-500";

      } else {

        statusUsuario.textContent =
          t.desconectado;

        statusUsuario.className =
          "text-center mt-8 text-sm text-gray-500";

      }

    }


    /* =========================================================
       COMPRAR SEGREDÁRIOS
       ========================================================= */

    function iniciarCompra() {

      const t =
        traducoes[idiomaAtual] ||
        traducoes.pt;


      /*
        Se não estiver logado,
        não tenta escrever no Firebase.
      */

      if (!usuarioAtual) {

        mostrarMensagem(
          t.login
        );

        /*
          Se quiser mandar diretamente
          para uma página de login,
          substitua por:

          window.location.href = "login.html";
        */

        return;
      }


      /*
        NÃO registramos "livros_comprados"
        aqui.

        Isso seria marcar o livro como comprado
        ANTES do pagamento.

        Em vez disso, enviamos o usuário para
        compras.html com o ID do produto.
      */

      botaoCompra.classList.add(
        "loading"
      );


      botaoCompra.textContent =
        t.encaminhando;


      /*
        Produto selecionado.

        compras.html poderá ler:
        ?produto=segredarios
      */

      window.location.href =
        "compras.html?produto=segredarios";

    }


    /* =========================================================
       BOTÃO
       ========================================================= */

    botaoCompra.addEventListener(
      "click",
      iniciarCompra
    );


    /* =========================================================
       INICIALIZAÇÃO
       ========================================================= */

    window.addEventListener(
      "load",
      function() {

        setLanguage(
          localStorage.getItem("idioma") || "pt"
        );

      }
    );

  </script>

</body>
